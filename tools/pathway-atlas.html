<!DOCTYPE html>
<!--
================================================================================
 Pathway Atlas — a standalone analysis tool for Ariadne Maps.

 NOT part of the app. Open this file directly in a browser and drop in the CSV
 the app's CSV button saves. Everything runs locally in the page; nothing is
 uploaded anywhere.

 THE PROBLEM. Pick a box on a big map and ask what it leads to, and the honest
 answer can be tens of millions of routes. Listing them is hopeless, and the
 previous tool's answer — walk every one and fold the results — eventually ran
 out of memory at around twenty million.

 THE IDEA. Do not walk them at all. The complete set of pathways from a box is
 already written down in the map: it is the subgraph of everything that box can
 reach. Enumerating it converts a linear amount of information into an
 exponential amount of paper. So this tool never enumerates. It rewrites that
 subgraph into a smaller one standing for the same pathways, and gets the counts
 by arithmetic over the structure.

   scope      keep only what the start box can reach
   loops      contract each feedback loop to a single element
   name       propose a grouping from the box names
   refine     split any group whose members do not behave alike
   decompose  cut the result into single-entry / single-exit regions
   count      exact totals, by dynamic programming, in arbitrary precision

 Nothing is sampled, capped, budgeted or truncated at any point. There is no
 progress bar because there is nothing slow enough to need one.

 WHAT YOU GET. One expandable structure. A shared spine of segments every
 pathway follows, and at each split a set of alternatives you can open, each
 carrying an exact count of how many readings run through it and a badge naming
 which lanes take it. Everything reachable appears exactly once.

 See tools/README.md for how it works and what it was measured against.
================================================================================
-->

<div class="shell">
  <aside class="rail">
    <div>
      <h1>Pathway Atlas</h1>

    </div>

    <div>
      <label class="field" for="map-pick">Map</label>
      <select id="map-pick">

        <option value="big">Demo — 296 boxes, 818 links</option>

    <div id="own-wrap" hidden>
      <div class="row-btns" style="margin-bottom:7px">

        <option value="0">Off — no name grouping</option>

      </select>
    </div>

    <div>
      <label class="field" for="min-reuse">A lane value must appear in</label>
      <select id="min-reuse">
        <option value="1">1 role — anything goes</option>
        <option value="2" selected>2 roles</option>
        <option value="3">3 roles — strictest</option>

    <label class="check"><input type="checkbox" id="stop-outcomes">
      <span>Stop at outcome boxes rather than running on through them</span></label>

      <button class="btn" id="collapse-all">Close all</button>

  <main class="main" id="main"><p class="busy">Loading…</p></main>

<script>
"use strict";
// ===========================================================================
// READING THE APP'S CSV
// ===========================================================================
function splitCsvLine(line) {
  const out = [];
  let cur = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') quoted = false;
      else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function parseAriadneCsv(text) {
  const sections = {};
  let current = null, headers = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^#\s*SECTION:\s*(\w+)/i);
    if (m) { current = m[1].toLowerCase(); sections[current] = []; headers = null; continue; }
    if (line.startsWith("#") || !current) continue;
    const cells = splitCsvLine(line);
    if (!headers) { headers = cells.map(c => c.trim().toLowerCase()); continue; }
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cells[i] ?? "").trim(); });
    sections[current].push(obj);
  }
  const streamLabel = {}, catLabel = {};
  for (const s of sections.streams || []) streamLabel[s.id] = s.label || s.id;
  for (const c of sections.categories || []) catLabel[c.id] = c.label || c.id;
  const nodes = (sections.nodes || []).map(r => ({
    id: r.id, label: r.label || r.id,
    stream: streamLabel[r.stream] || r.stream || "",
    category: catLabel[(r.category || "").split(/[;|]/)[0]] || r.category || "",
    controllable: r.controllable === "true", direction: r.direction || "",
  }));
  const known = new Set(nodes.map(n => n.id));
  const defaults = { enables: 0.30, increases: 0.25, decreases: -0.25 };
  for (const d of sections.defaults || []) {
    if (d.key === "elasticity_enables") defaults.enables = parseFloat(d.value);
    if (d.key === "elasticity_increases") defaults.increases = parseFloat(d.value);
    if (d.key === "elasticity_decreases") defaults.decreases = parseFloat(d.value);
  }
  const edges = (sections.edges || [])
    .filter(r => known.has(r.from) && known.has(r.to))
    .map(r => {
      const raw = parseFloat(r.elasticity);
      const effect = r.effect || "increases";
      return { from: r.from, to: r.to, effect, elasticity: isNaN(raw) ? (defaults[effect] ?? 0.25) : raw };
    });
  return { nodes, edges, name: "your map" };
}

// ===========================================================================
// DEMO MAPS
// ===========================================================================
const E = (from, to, elasticity = 0.3) =>
  ({ from, to, effect: elasticity < 0 ? "decreases" : "increases", elasticity });
const N = (id, label) => ({ id, label, stream: "", category: "", controllable: false, direction: "" });

// Multi-word lane values, lanes whose varying parts differ in length, and two
// decoys that must NOT be grouped.
function demoLanes() {
  const nodes = [], edges = [];
  const add = (id, label) => { nodes.push(N(id, label)); return id; };
  add("policy", "Enforcement Policy"); add("funding", "Operational Funding"); add("outcome", "Harm Reduction");
  for (const c of ["Cat A", "Cat B", "Cat C", "Cat D"]) {
    add(c + "|t", c + " Targets"); add(c + "|r", c + " Referrals"); add(c + "|o", c + " Offenders Charged");
    edges.push(E("policy", c + "|t"), E("funding", c + "|t"), E(c + "|t", c + "|r"),
               E(c + "|r", c + "|o"), E(c + "|o", "outcome"));
  }
  for (const d of ["Cannabis", "Cocaine", "Class A Drug", "Heroin"]) {
    add(d + "|s", d + " Seizure"); add(d + "|q", d + " Testing");
    edges.push(E("policy", d + "|s"), E(d + "|s", d + "|q"), E(d + "|q", "outcome"));
  }
  add("pick", "Pick rate"); add("damage", "Damage rate");
  edges.push(E("funding", "pick"), E("pick", "outcome"), E("policy", "damage"), E("damage", "outcome"));
  add("s1", "Import Stage"); add("s2", "Seizure Stage"); add("s3", "Testing Stage");
  edges.push(E("policy", "s1"), E("s1", "s2"), E("s2", "s3"), E("s3", "outcome"));
  return { nodes, edges, name: "multi-word lanes demo" };
}

// 296 boxes and 818 links, laid out the way a real policy map is.
function demoBig() {
  const nodes = [], edges = [];
  const add = (id, label) => { nodes.push(N(id, label)); return id; };
  const lanes = ["Cannabis", "Cocaine", "Heroin", "Cat A", "Cat B", "Class A Drug", "Synthetic Opioid", "Prescription"];
  const roles = ["Import", "Seizure", "Testing", "Charging", "Prosecution", "Sentencing",
                 "Supply Chain", "Street Supply", "Street Price", "User Demand",
                 "Treatment Referral", "Treatment Uptake", "Reoffending", "County Lines",
                 "Community Harm", "Health Burden", "Policing Cost", "Public Confidence",
                 "Market Adaptation", "Displacement", "Deterrence", "Recorded Crime",
                 "Youth Involvement", "Debt Bondage"];
  add("start", "Enforcement Budget"); add("end", "Total Drug Harm");
  for (const lane of lanes) for (const role of roles) add(lane + "|" + role, lane + " " + role);
  const shared = [];
  for (let i = 0; i < 102; i++) shared.push(add("sh" + i, "Shared Factor " + (i + 1)));
  for (const lane of lanes) {
    for (let i = 0; i + 1 < roles.length; i++) edges.push(E(lane + "|" + roles[i], lane + "|" + roles[i + 1]));
    edges.push(E("start", lane + "|" + roles[0]));
    edges.push(E(lane + "|" + roles[roles.length - 1], "end"));
    for (let i = 0; i + 2 < roles.length; i += 3) edges.push(E(lane + "|" + roles[i], lane + "|" + roles[i + 2]));
    for (let i = 0; i + 4 < roles.length; i += 2) edges.push(E(lane + "|" + roles[i], lane + "|" + roles[i + 4]));
    for (let i = 1; i + 5 < roles.length; i += 4) edges.push(E(lane + "|" + roles[i], lane + "|" + roles[i + 5]));
  }
  shared.forEach((s, i) => {
    const r = i % (roles.length - 6);
    const a = lanes[i % lanes.length], b = lanes[(i + 1) % lanes.length];
    edges.push(E(a + "|" + roles[r], s));
    edges.push(E(lanes[(i + 2) % lanes.length] + "|" + roles[r + 1], s));
    edges.push(E(s, b + "|" + roles[r + 4]));
    if (i % 4 === 0) { edges.push(E("start", s)); edges.push(E(s, "end")); }
    if (i % 5 === 0) edges.push(E(s, lanes[(i + 2) % lanes.length] + "|" + roles[r + 5]));
    if (i % 2 === 0) edges.push(E(s, lanes[(i + 3) % lanes.length] + "|" + roles[r + 6]));
  });
  for (const lane of lanes.slice(0, 4))
    edges.push(E(lane + "|User Demand", lane + "|Street Price", -0.3));
  return { nodes, edges, name: "296-box demo" };
}

// ATLAS-ENGINE-START (kept verbatim; tests/pathway-atlas.test.ts reads it from here)
// ===========================================================================
// PATHWAY ATLAS ENGINE
// ---------------------------------------------------------------------------
// The move this is built on: never enumerate pathways.
//
// The complete set of pathways from a box is already written down in the graph
// itself — it is the subgraph of everything that box can reach. Enumerating it
// turns a linear amount of information into an exponential amount of paper. So
// we never do. Each step below rewrites that subgraph into a smaller one that
// stands for the same pathways, and the counts come from arithmetic over the
// structure rather than from tallying things as we walk past them.
//
//   scope      keep only what the start box can reach
//   loops      contract each feedback loop to a single element
//   name       propose a grouping from the box names
//   refine     split any group whose members do not behave alike
//   decompose  cut the result into single-entry / single-exit regions
//   count      exact totals by dynamic programming (BigInt)
//
// Nothing is sampled, capped, budgeted or truncated at any point, so "every
// pathway is represented" is a property of the construction rather than a hope.
//
// TWO GUARANTEES, and the refine step is what buys the second one:
//
//   complete  every pathway in the map is one of the readings on screen, so an
//             impact cannot be missed however far it meanders
//   sound     every reading on screen is a pathway that really exists
//
// Grouping by name alone gives the first and quietly breaks the second. Fold
// "Cannabis Seizure" and "Cocaine Seizure" into one "◇ Seizure" and the page
// starts offering "Cannabis Import → ◇ Seizure → Cocaine Testing" — a sentence
// no route in the map actually says. So a proposed group is kept only while
// its members agree on which groups they lead to; where they disagree it is
// split, and that split is worth reading, because it is the map saying this is
// where the lanes stop behaving alike.
// ===========================================================================

const SLOT = "◇";        // stands in for whatever varies between lanes
const END = "\u0000END";      // virtual finish, so every pathway has one
const SEP = "\u0001";                // never appears in a label

// ---------------------------------------------------------------------------
// 0. GRAPH
// ---------------------------------------------------------------------------
function buildGraph(map) {
  const byId = new Map(), out = new Map(), inc = new Map();
  for (const n of map.nodes) { byId.set(n.id, n); out.set(n.id, []); inc.set(n.id, []); }
  const edges = [];
  for (const e of map.edges) {
    if (!byId.has(e.from) || !byId.has(e.to)) continue;
    edges.push(e);
    out.get(e.from).push(e);
    inc.get(e.to).push(e);
  }
  return { nodes: map.nodes, edges, byId, out, inc, name: map.name || "map" };
}

function reachableFrom(G, startId, stopAt) {
  const seen = new Set([startId]), stack = [startId];
  while (stack.length) {
    const id = stack.pop();
    if (stopAt && id !== startId && stopAt.has(id)) continue;
    for (const e of G.out.get(id) || []) if (!seen.has(e.to)) { seen.add(e.to); stack.push(e.to); }
  }
  return seen;
}

// ---------------------------------------------------------------------------
// 1. NAME GROUPING
// ---------------------------------------------------------------------------
// A LANE is one value of a dimension the map repeats itself along — Cannabis,
// Cocaine, Cat A, Cat B. A ROLE is what a box does once its lane is stripped
// off: "Cat ◇ Targets".
//
// The family key is a PREFIX and a SUFFIX rather than one word position, so
// the varying part can run to several words and can differ in length between
// members: "Class A Drug Seizure" and "Cannabis Seizure" share the key
// (prefix "", suffix "Seizure").
//
// Four tests, because label similarity on its own invents families:
//   size       a family needs enough members to be a pattern, not a coincidence
//   adjacency  lane members are ALTERNATIVES, so none is linked to another —
//              a sequence (Import → Seizure → Testing) fails this
//   reuse      a lane value must play its part in more than one role, so a
//              single coincidental pair cannot mint a lane
//   role       members must sit in the same part of the map: what flows into
//              and out of them has to play overlapping parts
//
// Everything here is only a PROPOSAL. Step 3 checks it against behaviour.
// ---------------------------------------------------------------------------
const LANE_DEFAULTS = {
  minMembers: 3,          // how many boxes make a family
  minTokenFamilies: 2,    // a lane value must appear in this many roles
  maxSpan: 3,             // how many words the varying part may run to
  neighbourOverlap: 0.25, // how alike members' surroundings must be
};

const words = s => String(s).split(/\s+/).filter(Boolean);

function candidateFamilies(nodes, maxSpan) {
  const byKey = new Map();
  for (const n of nodes) {
    const w = words(n.label || n.id);
    for (let i = 0; i < w.length; i++) {
      for (let j = i + 1; j <= Math.min(w.length, i + maxSpan); j++) {
        const pre = w.slice(0, i), suf = w.slice(j);
        if (pre.length + suf.length === 0) continue;   // need something to anchor on
        const key = pre.join(" ") + SEP + suf.join(" ");
        let m = byKey.get(key);
        if (!m) byKey.set(key, m = new Map());
        if (!m.has(n.id)) m.set(n.id, w.slice(i, j).join(" "));
      }
    }
  }
  return byKey;
}

function detectLanes(nodes, edges, opts = {}) {
  const o = { ...LANE_DEFAULTS, ...opts };
  if (!o.minMembers) return {
    roleOf: new Map(nodes.map(n => [n.id, "N:" + n.id])), laneOf: new Map(),
    families: [], laneValues: new Set(), rejected: [], foldedBoxes: 0, roleCount: nodes.length,
  };

  const linked = new Set();
  for (const e of edges) { linked.add(e.from + SEP + e.to); linked.add(e.to + SEP + e.from); }

  const rejected = [], pool = [];
  for (const [key, m] of candidateFamilies(nodes, o.maxSpan)) {
    if (m.size < o.minMembers) continue;
    const members = [...m].map(([id, token]) => ({ id, token }));
    if (new Set(members.map(x => x.token)).size !== members.length) continue;

    let adjacent = false;
    for (let i = 0; i < members.length && !adjacent; i++)
      for (let j = i + 1; j < members.length && !adjacent; j++)
        if (linked.has(members[i].id + SEP + members[j].id)) adjacent = true;
    if (adjacent) { rejected.push({ key, why: "members are linked to each other, so this is a sequence not a set of alternatives" }); continue; }

    const [pre, suf] = key.split(SEP);
    pool.push({ key, pre, suf, members, anchor: words(pre).length + words(suf).length });
  }

  // Lane values and families define each other, so settle them together.
  let kept = pool;
  for (let round = 0; round < 6; round++) {
    const tokenFamilies = new Map();
    for (const f of kept)
      for (const t of new Set(f.members.map(m => m.token)))
        tokenFamilies.set(t, (tokenFamilies.get(t) || 0) + 1);
    const values = new Set([...tokenFamilies]
      .filter(([t, c]) => c >= o.minTokenFamilies && !/^[0-9]+$/.test(t) && t.length > 1)
      .map(([t]) => t));
    const next = pool
      .map(f => ({ ...f, members: f.members.filter(m => values.has(m.token)) }))
      .filter(f => f.members.length >= o.minMembers);
    const settled = next.length === kept.length &&
      next.every((f, i) => f.key === kept[i].key && f.members.length === kept[i].members.length);
    kept = next;
    if (settled) break;
  }

  // Bigger family wins a contested box; more anchor words breaks the tie.
  const assign = list => {
    const roleOf = new Map(), laneOf = new Map(), claimed = new Set();
    for (const f of [...list].sort((a, b) =>
      b.members.length - a.members.length || b.anchor - a.anchor || (a.key < b.key ? -1 : 1)))
      for (const m of f.members) {
        if (claimed.has(m.id)) continue;
        claimed.add(m.id);
        roleOf.set(m.id, "L:" + f.key);
        laneOf.set(m.id, m.token);
      }
    return { roleOf, laneOf };
  };

  // "Pick rate" and "Damage rate" share a word and nothing else; real lane
  // siblings sit in the same place in the map, so what flows into and out of
  // them plays the same parts.
  const tentative = assign(kept);
  const around = new Map();
  for (const e of edges) {
    if (!around.has(e.from)) around.set(e.from, new Set());
    if (!around.has(e.to)) around.set(e.to, new Set());
    around.get(e.from).add(tentative.roleOf.get(e.to) || "N:" + e.to);
    around.get(e.to).add(tentative.roleOf.get(e.from) || "N:" + e.from);
  }
  const survivors = [];
  for (const f of kept) {
    const mine = f.members.filter(m => tentative.roleOf.get(m.id) === "L:" + f.key);
    if (mine.length < o.minMembers) continue;
    const sets = mine.map(m => around.get(m.id) || new Set());
    let pairs = 0, total = 0;
    for (let i = 0; i < sets.length; i++)
      for (let j = i + 1; j < sets.length; j++) {
        let inter = 0;
        for (const r of sets[i]) if (sets[j].has(r)) inter++;
        const union = sets[i].size + sets[j].size - inter;
        total += union ? inter / union : 0;
        pairs++;
      }
    const overlap = pairs ? total / pairs : 1;
    if (overlap < o.neighbourOverlap) {
      rejected.push({ key: f.key, why: `members sit in different parts of the map (${(overlap * 100).toFixed(0)}% shared surroundings)` });
      continue;
    }
    survivors.push({ ...f, members: mine, overlap });
  }

  const { roleOf, laneOf } = assign(survivors);
  for (const n of nodes) if (!roleOf.has(n.id)) roleOf.set(n.id, "N:" + n.id);

  const size = new Map();
  for (const role of roleOf.values()) size.set(role, (size.get(role) || 0) + 1);

  return {
    roleOf, laneOf, rejected,
    families: survivors
      .map(f => ({ ...f, members: f.members.filter(m => roleOf.get(m.id) === "L:" + f.key) }))
      .filter(f => f.members.length >= o.minMembers)
      .sort((a, b) => b.members.length - a.members.length),
    laneValues: new Set(laneOf.values()),
    foldedBoxes: [...size.values()].filter(c => c > 1).reduce((a, c) => a + c, 0),
    roleCount: size.size,
  };
}

const familyLabel = key => {
  const [pre, suf] = key.split(SEP);
  return (pre ? pre + " " : "") + SLOT + (suf ? " " + suf : "");
};

function roleLabel(role, byId) {
  if (!role.startsWith("L:")) {
    const n = byId.get(role.slice(2));
    return n ? (n.label || n.id) : role.slice(2);
  }
  return familyLabel(role.slice(2));
}

// ---------------------------------------------------------------------------
// 2. FEEDBACK LOOPS
// ---------------------------------------------------------------------------
// Every mutually-reachable group of boxes becomes one element. A pathway can
// enter a loop and leave it, but never go round it — which is how people read
// a strand, and what leaves the rest of the pipeline working on something
// guaranteed to be acyclic.
// ---------------------------------------------------------------------------
function stronglyConnected(ids, succ) {
  const index = new Map(), low = new Map(), onStack = new Set(), stack = [], comps = [];
  let counter = 0;
  for (const root of ids) {
    if (index.has(root)) continue;
    const work = [{ v: root, kids: null, i: 0 }];
    while (work.length) {
      const f = work[work.length - 1];
      if (f.kids === null) {
        index.set(f.v, counter); low.set(f.v, counter); counter++;
        stack.push(f.v); onStack.add(f.v);
        f.kids = [...(succ.get(f.v) || [])];
      }
      if (f.i < f.kids.length) {
        const w = f.kids[f.i++];
        if (!index.has(w)) work.push({ v: w, kids: null, i: 0 });
        else if (onStack.has(w)) low.set(f.v, Math.min(low.get(f.v), index.get(w)));
        continue;
      }
      if (low.get(f.v) === index.get(f.v)) {
        const comp = [];
        for (;;) { const w = stack.pop(); onStack.delete(w); comp.push(w); if (w === f.v) break; }
        comps.push(comp);
      }
      work.pop();
      if (work.length) {
        const p = work[work.length - 1].v;
        low.set(p, Math.min(low.get(p), low.get(f.v)));
      }
    }
  }
  return comps;
}

function collapseLoops(scope, edges) {
  const succ = new Map();
  for (const id of scope) succ.set(id, new Set());
  for (const e of edges) if (scope.has(e.from) && scope.has(e.to)) succ.get(e.from).add(e.to);

  const groupOf = new Map(), groups = new Map();
  let n = 0;
  for (const comp of stronglyConnected([...scope], succ)) {
    const loop = comp.length > 1 || succ.get(comp[0]).has(comp[0]);
    const id = "g" + (n++);
    for (const b of comp) groupOf.set(b, id);
    groups.set(id, { id, loop, boxes: comp });
  }
  const gsucc = new Map(), gpred = new Map();
  for (const id of groups.keys()) { gsucc.set(id, new Set()); gpred.set(id, new Set()); }
  for (const [a, outs] of succ)
    for (const b of outs) {
      const x = groupOf.get(a), y = groupOf.get(b);
      if (x === y) continue;
      gsucc.get(x).add(y); gpred.get(y).add(x);
    }
  return { groups, groupOf, succ: gsucc, pred: gpred };
}

// ---------------------------------------------------------------------------
// 3. REFINE THE GROUPING UNTIL IT IS TRUE
// ---------------------------------------------------------------------------
// Start from what the names propose, then repeatedly split any group whose
// members disagree about which groups they lead to. What settles out is the
// coarsest grouping in which members really are interchangeable going forward.
//
// Two things follow, and both matter:
//   * every stretch on the page is walkable in the real map, because each
//     member of a group has a successor in every one of that group's
//     successors;
//   * the result cannot hold a loop the map does not, because a loop among
//     groups would force an endless forward chain through an acyclic graph.
//     Grouping by name alone offers no such assurance — it will happily turn
//     "Cannabis Seizure → Shared Factor → Cocaine Import" into feedback that
//     nobody drew.
// ---------------------------------------------------------------------------
// Both settings run the same refinement; they differ only in when to stop.
//
//   as far as possible  stop the moment the grouping is loop-safe. This is the
//                       most condensed honest answer: no invented feedback, but
//                       a group may hold members that go on to differ, and the
//                       lane badges on each branch are what tell you so.
//   where behaviour matches  run to the fixpoint. Every step on the page is
//                       then one that every member of its group really takes.
//                       Strictly truer, and on a map whose lanes are wired
//                       even slightly differently it condenses far less.
//
// Neither can miss a pathway. The difference is only how much is claimed about
// the members of a group, which is why the tool reports both numbers.
function quotientHasCycle(ids, succ, cls) {
  const csucc = new Map();
  for (const id of ids) {
    const c = cls.get(id);
    if (!csucc.has(c)) csucc.set(c, new Set());
  }
  for (const id of ids) {
    const c = cls.get(id);
    for (const s of succ.get(id)) {
      const d = cls.get(s);
      if (d === c) return true;
      csucc.get(c).add(d);
    }
  }
  return stronglyConnected([...csucc.keys()], csucc).some(comp => comp.length > 1);
}

function refineForward(ids, succ, initial, strict) {
  let cls = new Map(ids.map(id => [id, String(initial.get(id))]));
  let count = new Set(cls.values()).size;
  for (let round = 0; round <= ids.length + 1; round++) {
    if (!strict && !quotientHasCycle(ids, succ, cls)) return { cls, rounds: round, settled: false };
    const sig = new Map(), rename = new Map();
    for (const id of ids) {
      const outs = [...new Set([...succ.get(id)].map(x => cls.get(x)))].sort().join(",");
      sig.set(id, cls.get(id) + SEP + outs);
    }
    for (const id of ids) if (!rename.has(sig.get(id))) rename.set(sig.get(id), "c" + rename.size);
    if (rename.size === count) return { cls, rounds: round, settled: true };
    cls = new Map(ids.map(id => [id, rename.get(sig.get(id))]));
    count = rename.size;
  }
  return { cls, rounds: ids.length, settled: true };
}

// ---------------------------------------------------------------------------
// 4. POST-DOMINATORS → single-entry / single-exit regions
// ---------------------------------------------------------------------------
// Where the pathways split, the question worth answering is where they come
// back together. That element is the immediate POST-DOMINATOR of the split:
// the first one every route from the split must reach. Everything between the
// two is a self-contained choice — exactly the unit worth putting on screen
// behind one open/close triangle.
// ---------------------------------------------------------------------------
function reversePostorder(root, succOf) {
  const seen = new Set([root]), post = [], stack = [{ n: root, kids: null, i: 0 }];
  while (stack.length) {
    const f = stack[stack.length - 1];
    if (f.kids === null) f.kids = succOf(f.n);
    if (f.i < f.kids.length) {
      const s = f.kids[f.i++];
      if (!seen.has(s)) { seen.add(s); stack.push({ n: s, kids: null, i: 0 }); }
      continue;
    }
    post.push(f.n); stack.pop();
  }
  return post.reverse();
}

function immediateDominators(root, succOf, predOf) {
  const rpo = reversePostorder(root, succOf);
  const num = new Map(rpo.map((n, i) => [n, i]));
  const idom = new Map([[root, root]]);
  const intersect = (a, b) => {
    while (a !== b) {
      while (num.get(a) > num.get(b)) a = idom.get(a);
      while (num.get(b) > num.get(a)) b = idom.get(b);
    }
    return a;
  };
  for (let changed = true; changed;) {
    changed = false;
    for (const n of rpo) {
      if (n === root) continue;
      let cand = null;
      for (const p of predOf(n)) {
        if (!num.has(p) || !idom.has(p)) continue;
        cand = cand === null ? p : intersect(p, cand);
      }
      if (cand !== null && idom.get(n) !== cand) { idom.set(n, cand); changed = true; }
    }
  }
  return idom;
}

// Exact totals: paths(n) is how many pathways run from n to the finish, summed
// over successors in reverse topological order. BigInt, because on a real map
// this number is genuinely astronomical.
function countPaths(start, succOf) {
  const topo = reversePostorder(start, succOf);
  const paths = new Map([[END, 1n]]);
  for (let i = topo.length - 1; i >= 0; i--) {
    const n = topo[i];
    if (n === END) continue;
    let total = 0n;
    for (const s of succOf(n)) total += paths.get(s) || 0n;
    paths.set(n, total);
  }
  return paths;
}

function addFinish(succ, pred) {
  succ.set(END, new Set());
  if (pred) pred.set(END, new Set());
  const finishes = [];
  for (const [id, outs] of succ) {
    if (id === END || outs.size) continue;
    finishes.push(id);
    outs.add(END);
    if (pred) pred.get(END).add(id);
  }
  return finishes;
}

// ---------------------------------------------------------------------------
// 5. THE ATLAS
// ---------------------------------------------------------------------------
function buildAtlas(G, startId, opts = {}) {
  const t0 = Date.now();
  const stopAt = opts.stopAtOutcomes
    ? new Set(G.nodes.filter(n => n.direction).map(n => n.id))
    : null;

  const scope = reachableFrom(G, startId, stopAt);
  const scopedNodes = G.nodes.filter(n => scope.has(n.id));
  const scopedEdges = G.edges.filter(e =>
    scope.has(e.from) && scope.has(e.to) &&
    !(stopAt && stopAt.has(e.from) && e.from !== startId));

  const lanes = detectLanes(scopedNodes, scopedEdges, opts.lanes || {});
  const L = collapseLoops(scope, scopedEdges);
  const startGroup = L.groupOf.get(startId);

  // What the names propose. Identical loops in different lanes get the same
  // proposal, so four copies of one feedback loop become one element.
  const initial = new Map();
  for (const [gid, g] of L.groups) {
    if (gid === startGroup) { initial.set(gid, "START"); continue; }
    const roles = [...new Set(g.boxes.map(b => lanes.roleOf.get(b)))].sort();
    initial.set(gid, g.loop ? "LOOP:" + roles.join("+") : roles[0]);
  }

  const gids = [...L.groups.keys()];
  const refined = refineForward(gids, L.succ, initial, opts.grouping === "strict");
  const classOf = refined.cls;

  // The quotient: one element per settled class.
  const nodes = new Map(), succ = new Map(), pred = new Map();
  for (const gid of gids) {
    const cid = classOf.get(gid);
    let node = nodes.get(cid);
    if (!node) {
      nodes.set(cid, node = { id: cid, loop: false, boxes: [], lanes: new Set(), copies: 0, roles: new Set() });
      succ.set(cid, new Set()); pred.set(cid, new Set());
    }
    const g = L.groups.get(gid);
    node.copies++;
    node.loop = node.loop || g.loop;
    for (const b of g.boxes) {
      node.boxes.push(b);
      node.roles.add(lanes.roleOf.get(b));
      const lane = lanes.laneOf.get(b);
      if (lane) node.lanes.add(lane);
    }
  }
  // Which lanes actually take each step, and which do not. On the looser
  // setting this is the whole story of where the strands differ, so it is
  // recorded rather than inferred.
  const stepLanes = new Map(), stepTakenBy = new Map();
  for (const [a, outs] of L.succ)
    for (const b of outs) {
      const x = classOf.get(a), y = classOf.get(b);
      if (x === y) continue;
      succ.get(x).add(y); pred.get(y).add(x);
      const key = x + ">" + y;
      if (!stepLanes.has(key)) { stepLanes.set(key, new Set()); stepTakenBy.set(key, new Set()); }
      stepTakenBy.get(key).add(a);
      for (const box of L.groups.get(a).boxes) {
        const lane = lanes.laneOf.get(box);
        if (lane) stepLanes.get(key).add(lane);
      }
    }

  // How many steps on the page are taken by only some members of their group.
  // Zero on the strict setting by construction; on the looser one this is the
  // honest measure of what the condensation is glossing over.
  let partialSteps = 0;
  const membersOf = new Map();
  for (const gid of gids) {
    const c = classOf.get(gid);
    membersOf.set(c, (membersOf.get(c) || 0) + 1);
  }
  for (const [key, takers] of stepTakenBy)
    if (takers.size < membersOf.get(key.split(">")[0])) partialSteps++;
  for (const node of nodes.values()) {
    const roles = [...node.roles];
    node.label = node.loop
      ? "loop: " + roles.map(r => roleLabel(r, G.byId)).join(" ↔ ")
      : roles.length === 1 && node.boxes.length > 1
        ? roleLabel(roles[0], G.byId)
        : (G.byId.get(node.boxes[0]) || {}).label || node.boxes[0];
  }

  const start = classOf.get(startGroup);
  nodes.set(END, { id: END, label: "end", loop: false, boxes: [], lanes: new Set(), copies: 0, roles: new Set(), end: true });
  const finishes = addFinish(succ, pred);
  const succOf = n => [...succ.get(n)];
  const predOf = n => [...pred.get(n)];
  const ipdom = immediateDominators(END, predOf, succOf);
  const paths = countPaths(start, succOf);

  // The same structure with no grouping at all, so the condensation is
  // measured rather than asserted and the true pathway total is to hand.
  const rawSucc = new Map();
  for (const gid of gids) rawSucc.set(gid, new Set(L.succ.get(gid)));
  addFinish(rawSucc, null);
  const rawPaths = countPaths(startGroup, n => [...rawSucc.get(n)]);

  const ctx = { nodes, ipdom, paths, succ: succOf, END,
                limit: nodes.size + 8, emitted: new Set(), tails: new Map() };
  const tree = buildSequence(start, END, ctx);

  // Where a proposed family had to be split because its members stopped
  // behaving alike. Not a failure — this is the divergence, named.
  const splits = new Map();
  for (const [gid, cid] of classOf) {
    const proposal = initial.get(gid);
    if (!proposal.startsWith("L:")) continue;
    if (!splits.has(proposal)) splits.set(proposal, new Set());
    splits.get(proposal).add(cid);
  }

  return {
    startId, start, tree, nodes, succ, pred, ipdom, paths, lanes, scope, finishes,
    tails: ctx.tails, stepLanes, stepTakenBy,
    grouping: opts.grouping === "strict" ? "strict" : "loose",
    everyStepShared: partialSteps === 0,
    partialSteps, totalSteps: stepTakenBy.size,
    loops: [...nodes.values()].filter(n => n.loop),
    shapes: paths.get(start) || 0n,
    pathways: rawPaths.get(startGroup) || 0n,
    boxesInScope: scope.size,
    elements: nodes.size - 1,
    elementsUngrouped: gids.length,
    splitFamilies: [...splits]
      .filter(([, s]) => s.size > 1)
      .map(([role, s]) => ({ key: role.slice(2), into: s.size }))
      .sort((a, b) => b.into - a.into),
    refineRounds: refined.rounds,
    ms: Date.now() - t0,
  };
}

// Walk the spine from `entry` to `stop`, opening a nested choice wherever the
// pathways split. Progress is guaranteed: a split's rejoin is always strictly
// later in the order than the split itself.
//
// Two alternatives out of one split can pass through the same element without
// ALL of them doing so — n→a→m→x, n→a→q→x, n→b→m→x. Writing m out under both
// would duplicate the stretch, and on a dense map that duplication compounds
// until the page is larger than the graph it came from. So an element is
// expanded once and later meetings point at it. Nothing is lost: the two
// readings continue identically from there.
function buildSequence(entry, stop, ctx) {
  const items = [];
  let n = entry, guard = 0;
  while (n !== stop && n !== ctx.END) {
    if (guard++ > ctx.limit) throw new Error("region walk failed to terminate at " + n);
    if (ctx.emitted.has(n)) { items.push({ kind: "join", id: n }); break; }
    ctx.emitted.add(n);
    items.push({ kind: "box", id: n });
    const outs = ctx.succ(n);
    if (outs.length === 0) break;
    if (outs.length === 1) { n = outs[0]; continue; }
    const rejoin = ctx.ipdom.get(n);
    const whole = ctx.paths.get(rejoin) || 1n;
    const alts = outs.map(s => ({
      first: s,
      shapes: (ctx.paths.get(s) || 0n) / whole,
      seq: s === rejoin ? [] : buildSequence(s, rejoin, ctx),
    })).sort((a, b) => (a.shapes > b.shapes ? -1 : a.shapes < b.shapes ? 1 : 0));
    items.push({ kind: "choice", at: n, rejoin: rejoin === ctx.END ? null : rejoin, alts });
    n = rejoin;
  }
  // What follows each element, so a "joins here" reads as the stretch it
  // points at rather than as a dead end.
  for (let i = 0; i < items.length; i++)
    if (items[i].kind === "box") ctx.tails.set(items[i].id, items.slice(i));
  return items;
}

// ---------------------------------------------------------------------------
// 6. READING AIDS
// ---------------------------------------------------------------------------
// Which lanes reach a stretch. One only some lanes can reach is a real
// divergence — the pocket where those lanes behave unlike the rest.
function lanesIn(seq, nodes, into = new Set()) {
  for (const item of seq) {
    if (item.kind === "choice") for (const a of item.alts) lanesIn(a.seq, nodes, into);
    else for (const l of nodes.get(item.id).lanes || []) into.add(l);
  }
  return into;
}

function boxesIn(seq, nodes, into = new Set()) {
  for (const item of seq) {
    if (item.kind === "choice") for (const a of item.alts) boxesIn(a.seq, nodes, into);
    else for (const b of nodes.get(item.id).boxes || []) into.add(b);
  }
  return into;
}

function countItems(seq, acc = { boxes: 0, choices: 0, joins: 0, depth: 0 }, depth = 0) {
  acc.depth = Math.max(acc.depth, depth);
  for (const item of seq) {
    if (item.kind === "box") acc.boxes++;
    else if (item.kind === "join") acc.joins++;
    else { acc.choices++; for (const a of item.alts) countItems(a.seq, acc, depth + 1); }
  }
  return acc;
}

function formatCount(n) {
  if (typeof n !== "bigint") n = BigInt(n);
  if (n < 1000000000000000n) return Number(n).toLocaleString("en-GB");
  const s = n.toString();
  return s[0] + "." + s.slice(1, 3) + " × 10^" + (s.length - 1);
}
// ATLAS-ENGINE-END

// ===========================================================================
// THE PAGE
// ===========================================================================
let G = null, ATLAS = null, START = null, QUERY = "";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, many) => n === 1 ? one : (many || one + "s");

// ── the left rail ─────────────────────────────────────────────────────────
function fillPicker() {
  const q = QUERY.trim().toLowerCase();
  const matches = G.nodes.filter(n => !q || (n.label || n.id).toLowerCase().includes(q));
  const groups = new Map();
  for (const n of matches.slice(0, 400)) {
    const g = n.stream || "Boxes";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(n);
  }
  const html = [...groups].map(([g, list]) =>
    `<div class="grp">${esc(g)}</div>` + list.map(n =>
      `<button type="button" data-id="${esc(n.id)}" aria-selected="${n.id === START}">${esc(n.label || n.id)}</button>`
    ).join("")).join("");
  $("start-list").innerHTML = html ||
    `<div class="grp">nothing matches “${esc(QUERY)}”</div>`;
  if (matches.length > 400)
    $("start-list").insertAdjacentHTML("beforeend",
      `<div class="grp">showing 400 of ${matches.length} — keep typing</div>`);
}

function railLanes() {
  const box = $("lane-box");
  if (!ATLAS) { box.innerHTML = ""; return; }
  const L = ATLAS.lanes;
  if (!L.families.length) {
    box.innerHTML = `<h3>Name grouping</h3><p class="hint">No families found. Either this map does
      not repeat itself along a named dimension, or the rules above are too strict —
      try a smaller family size.</p>`;
    return;
  }
  const fams = L.families.slice(0, 14).map(f =>
    `<div class="fam"><b>${esc(familyLabel(f.key))}</b><span>×${f.members.length}</span></div>`).join("");
  const values = [...L.laneValues].sort();
  box.innerHTML = `<h3>Name grouping</h3>
    <p class="hint" style="margin-bottom:7px"><b>${values.length}</b> ${plural(values.length, "lane")}:
      ${esc(values.slice(0, 12).join(", "))}${values.length > 12 ? ", …" : ""}</p>
    ${fams}
    ${L.families.length > 14 ? `<p class="hint" style="margin-top:6px">…and ${L.families.length - 14} more</p>` : ""}
    ${L.rejected.length ? `<details class="more"><summary>${L.rejected.length} rejected</summary>` +
      L.rejected.slice(0, 12).map(r =>
        `<div class="fam"><b>${esc(familyLabel(r.key))}</b></div>
         <p class="hint" style="margin:0 0 5px">${esc(r.why)}</p>`).join("") + `</details>` : ""}`;
}

function showElement(id) {
  const node = ATLAS && ATLAS.nodes.get(id);
  const box = $("detail-box");
  if (!node) { box.hidden = true; return; }
  box.hidden = false;
  const boxes = node.boxes.map(b => (G.byId.get(b) || {}).label || b).sort();
  box.innerHTML = `<h3>${esc(node.label)}</h3>
    <p class="hint" style="margin-bottom:6px">${boxes.length} ${plural(boxes.length, "box", "boxes")}
      ${node.loop ? " in a feedback loop" : node.copies > 1 ? ` grouped from ${node.copies} places` : ""}</p>
    ${boxes.slice(0, 40).map(b => `<div class="fam"><b>${esc(b)}</b></div>`).join("")}
    ${boxes.length > 40 ? `<p class="hint">…and ${boxes.length - 40} more</p>` : ""}`;
}

// ── the atlas ─────────────────────────────────────────────────────────────
function elHtml(id) {
  const node = ATLAS.nodes.get(id);
  const cls = ["el"];
  if (id === ATLAS.start) cls.push("start");
  if (node.loop) cls.push("loop");
  else if (node.boxes.length > 1) cls.push("folded");
  const many = node.loop
    ? `<span class="x">loop of ${node.boxes.length}</span>`
    : node.boxes.length > 1 ? `<span class="x">×${node.boxes.length}</span>` : "";
  const tip = node.boxes.slice(0, 10).map(b => (G.byId.get(b) || {}).label || b).join(" · ");
  return `<span class="${cls.join(" ")}" data-el="${esc(id)}" title="${esc(tip)}">${esc(node.label)}${many}</span>`;
}

function seqHtml(seq, depth) {
  let html = "", run = [];
  const flush = () => {
    if (!run.length) return;
    html += `<div class="seg">${run.map(elHtml).join('<span class="arrow">→</span>')}</div>`;
    run = [];
  };
  for (const item of seq) {
    if (item.kind === "box") { run.push(item.id); continue; }
    if (item.kind === "join") {
      flush();
      html += `<div class="joins">↳ carries on into <b>${esc(ATLAS.nodes.get(item.id).label)}</b>, opened above</div>`;
      continue;
    }
    flush();
    html += choiceHtml(item, depth);
  }
  flush();
  return html;
}

function choiceHtml(choice, depth) {
  const total = choice.alts.reduce((a, x) => a + x.shapes, 0n);
  const allLanes = ATLAS.lanes.laneValues;
  const rows = choice.alts.map((alt, i) => {
    const stepLanes = ATLAS.stepLanes.get(choice.at + ">" + alt.first) || new Set();
    const reach = lanesIn(alt.seq, ATLAS.nodes);
    for (const l of stepLanes) reach.add(l);
    const narrow = allLanes.size > 1 && reach.size > 0 && reach.size < allLanes.size;
    const tag = alt.seq.length === 0
      ? `<span class="tag straight">straight on</span>`
      : narrow
        ? `<span class="tag some">${esc([...reach].sort().slice(0, 4).join(", "))}${reach.size > 4 ? " +" + (reach.size - 4) : ""} only</span>`
        : reach.size ? `<span class="tag all">every lane</span>` : "";
    const head = alt.seq.length === 0
      ? "skips ahead"
      : "via " + esc(ATLAS.nodes.get(alt.first).label);
    const share = total > 0n ? Number(alt.shapes * 1000n / total) / 10 : 0;
    const open = depth === 0 && i === 0 ? " open" : "";
    return `<details class="alt"${open}>
      <summary><span class="alt-n">${i + 1}</span>${head}${tag}
        <span class="cnt">${formatCount(alt.shapes)} ${plural(alt.shapes === 1n ? 1 : 2, "reading")} · ${share.toFixed(share < 10 ? 1 : 0)}%</span>
      </summary>
      <div class="alt-body">${alt.seq.length ? seqHtml(alt.seq, depth + 1) : `<p class="hint">Nothing in between — this alternative goes straight to the rejoin.</p>`}</div>
    </details>`;
  }).join("");
  return `<div class="choice" data-d="${Math.min(depth, 3)}">
    <div class="choice-head">splits <b>${choice.alts.length} ways</b>${
      choice.rejoin ? ` · they all meet again at <b>${esc(ATLAS.nodes.get(choice.rejoin).label)}</b>`
                    : " · they never meet again"}</div>
    ${rows}</div>`;
}

function render() {
  const main = $("main");
  if (!ATLAS) { main.innerHTML = '<p class="busy">Pick a box to start from.</p>'; return; }
  const A = ATLAS;
  const startLabel = (G.byId.get(A.startId) || {}).label || A.startId;

  if (A.elements <= 0) {
    main.innerHTML = `<h2 class="section">Nothing downstream</h2>
      <p class="lede">Nothing leads away from <b>${esc(startLabel)}</b> following the arrows.</p>`;
    return;
  }

  const condensed = A.elementsUngrouped / Math.max(1, A.elements);
  const overcount = A.shapes > A.pathways;
  const stats = [
    ["Boxes reached", A.boxesInScope.toLocaleString("en-GB"), ""],
    ["Pathways", formatCount(A.pathways), ""],
    ["Readings", formatCount(A.shapes), A.shapes < A.pathways ? "good" : ""],
    ["Elements", `${A.elements}`, condensed >= 1.5 ? "good" : ""],
    ["Feedback loops", String(A.loops.length), ""],
    ["Built in", A.ms < 1000 ? A.ms + "ms" : (A.ms / 1000).toFixed(1) + "s", "good"],
  ];

  main.innerHTML = `
    <h2 class="section">Everything downstream of ${esc(startLabel)}</h2>
    <p class="lede">Every pathway from this box, with no sampling and no cut-off. Read the
      spine straight down; open a split to see the alternatives. Each one says how many
      readings run through it and which lanes take it. Everything reachable appears
      exactly once — where two alternatives rejoin, the second says so rather than
      repeating the stretch.</p>
    <div class="stats">${stats.map(([k, v, tone]) =>
      `<div><span class="k">${esc(k)}</span><span class="v ${tone}">${esc(v)}</span></div>`).join("")}</div>
    ${A.elementsUngrouped > A.elements
      ? `<p class="hint" style="margin:-8px 0 14px">Grouping folded <b>${A.elementsUngrouped}</b>
         elements down to <b>${A.elements}</b>${A.splitFamilies.length
          ? `. ${A.splitFamilies.length} ${plural(A.splitFamilies.length, "family", "families")} had to be
             split because their members stopped behaving alike — that split is itself a divergence worth reading.`
          : "."}</p>`
      : `<p class="hint" style="margin:-8px 0 14px">Nothing folded: no two boxes here are named alike
         and behave alike. That is a fact about the map, not a failure of the grouping.</p>`}
    ${overcount ? `<div class="note"><b>${formatCount(A.shapes)} readings stand for ${formatCount(A.pathways)} real pathways.</b>
      On this setting a group is kept together as long as it does not invent feedback, so some members
      of a group go on to differ — ${A.partialSteps} of ${A.totalSteps} steps are taken by only part of
      their group, and the lane badges are what tell you which. Every real pathway is still in here.
      Switch to <b>only where behaviour matches</b> for a page where every step shown is one that every
      member really takes.</div>` : ""}
    ${A.grouping === "strict" && A.partialSteps === 0 && A.elementsUngrouped > A.elements
      ? `<p class="hint" style="margin:-8px 0 14px">Every step on this page is one that every member of
         its group really takes.</p>` : ""}
    <div class="atlas">${seqHtml(A.tree, 0)}</div>`;
}

// ── running it ────────────────────────────────────────────────────────────
function run() {
  if (!G || !START) return;
  $("main").innerHTML = '<p class="busy">Building…</p>';
  // One frame, so the message paints. It has never needed more than one.
  requestAnimationFrame(() => {
    try {
      ATLAS = buildAtlas(G, START, {
        grouping: $("grouping").value,
        stopAtOutcomes: $("stop-outcomes").checked,
        lanes: {
          minMembers: Number($("min-members").value),
          minTokenFamilies: Number($("min-reuse").value),
        },
      });
    } catch (err) {
      $("main").innerHTML = `<h2 class="section">That did not work</h2>
        <p class="lede">${esc(err.message)}</p>`;
      return;
    }
    railLanes();
    render();
  });
}

function loadMap(map) {
  G = buildGraph(map);
  ATLAS = null;
  $("map-summary").textContent = `${map.nodes.length} boxes · ${map.edges.length} links · ${map.name}`;
  // Start somewhere worth looking: the box that reaches the most others.
  let best = null;
  for (const n of G.nodes) {
    const size = reachableFrom(G, n.id).size;
    if (!best || size > best.size) best = { id: n.id, size };
  }
  START = best ? best.id : (G.nodes[0] || {}).id;
  QUERY = "";
  $("start-q").value = "";
  fillPicker();
  $("detail-box").hidden = true;
  run();
}

function ingestCsv(text, source) {
  const status = $("csv-status");
  try {
    const map = parseAriadneCsv(text);
    if (!map.nodes.length) {
      status.textContent = "No boxes in that file. It needs to be the CSV the app's CSV button saves — the one with SECTION: nodes in it.";
      return;
    }
    $("map-pick").value = "own";
    $("own-wrap").hidden = false;
    status.textContent = `Loaded ${map.nodes.length} boxes and ${map.edges.length} links` +
      (source ? ` from ${source}` : "") + ".";
    loadMap(map);
  } catch (err) {
    status.textContent = "Could not read that file: " + err.message;
  }
}

function readFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => ingestCsv(String(r.result), file.name);
  r.onerror = () => { $("csv-status").textContent = "Could not read that file."; };
  r.readAsText(file);
}

// ── wiring ────────────────────────────────────────────────────────────────
$("map-pick").addEventListener("change", e => {
  const own = e.target.value === "own";
  $("own-wrap").hidden = !own;
  if (!own) loadMap(e.target.value === "big" ? demoBig() : demoLanes());
});
$("pick-file").addEventListener("click", () => $("csv-file").click());
$("csv-file").addEventListener("change", e => readFile(e.target.files[0]));
$("load-csv").addEventListener("click", () => ingestCsv($("csv-in").value, "the pasted text"));

let dragDepth = 0;
addEventListener("dragover", e => e.preventDefault());
addEventListener("dragenter", e => { e.preventDefault(); if (++dragDepth === 1) document.body.classList.add("dropping"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dropping"); } });
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dropping");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) readFile(f);
});

$("start-q").addEventListener("input", e => { QUERY = e.target.value; fillPicker(); });
$("start-list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-id]");
  if (!btn) return;
  START = btn.dataset.id;
  fillPicker();
  run();
});
for (const id of ["grouping", "min-members", "min-reuse", "stop-outcomes"])
  $(id).addEventListener("change", run);

$("main").addEventListener("click", e => {
  const el = e.target.closest("[data-el]");
  if (el) showElement(el.dataset.el);
});
$("expand-all").addEventListener("click", () =>
  document.querySelectorAll("#main details").forEach(d => { d.open = true; }));
$("collapse-all").addEventListener("click", () =>
  document.querySelectorAll("#main details").forEach(d => { d.open = false; }));
$("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", (now ? now === "dark" : sysDark) ? "light" : "dark");
});

$("grouping").addEventListener("change", e => {
  $("grouping-note").textContent = e.target.value === "strict"
    ? "Every step shown is one that every member of its group really takes. Truer, and usually less condensed."
    : "Groups are kept together unless doing so would invent feedback the map does not contain. Most condensed.";
});
$("grouping").dispatchEvent(new Event("change"));

loadMap(demoLanes());
</script>
</body>
</html>
