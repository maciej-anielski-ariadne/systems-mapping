<!DOCTYPE html>
<!--
================================================================================
 Pathway Atlas — a standalone analysis tool for Ariadne Maps.

 NOT part of the app. Open this file directly in a browser and drop in the CSV
 the app's CSV button saves. Everything runs locally in the page; nothing is
 uploaded anywhere.

 THE PROBLEM. Pick a box on a big map and ask what it leads to, and the honest
 answer can be millions of routes. Listing them is hopeless, and walking them
 all — what the earlier strand-condenser does — runs out of memory at around
 twenty million.

 THE IDEA. Do not walk them. The complete set of pathways from a box is already
 written down in the map: it is the subgraph of everything that box can reach.
 Enumerating it converts a linear amount of information into an exponential
 amount of paper. So this tool never enumerates. It rewrites that subgraph into
 a smaller one standing for the same pathways, and gets the counts by arithmetic
 over the structure.

   scope      keep only what the start box can reach
   loops      contract each feedback loop to a single element
   name       propose a grouping from the box names
   refine     split any group whose members do not behave alike
   decompose  cut the result into single-entry / single-exit regions
   count      exact totals, by dynamic programming, in arbitrary precision

 Nothing is sampled, capped, budgeted or truncated at any point.

 HOW YOU LOOK AT IT. The structure is one thing; the presentation is another.
 Six were prototyped — blocks, strands, a lane grid, one step at a time, a
 nested outline — and Flow won: the whole atlas as one picture, columns for how
 far along a pathway you are, height and thickness for how much runs through.
 Loops sits beside it, on its own tab, until the two are drawn as one picture.

 See tools/PATHWAY-ATLAS.md for how it works and what it was measured against.
================================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathway Atlas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%2314161d'/><path d='M5 19V9h5V5h9' fill='none' stroke='%23bfaede' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><path d='M10 9h6' fill='none' stroke='%238fb6d9' stroke-width='1.8' stroke-linecap='round'/><circle cx='5' cy='19' r='2' fill='%23bfaede'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* Tokens lifted from the app's 01-variables.css so this reads as part of
   Ariadne. Light (Linen) is the base; Twilight (dark) overrides it.
   The chart hues are separate and deliberate: Ariadne's accents are muted on
   purpose, which is right on a map and wrong for telling five lines apart, so
   the strand colours below are the same hues pushed to a chroma that survives
   colour-blind simulation, ordered so no red/green/amber pair sits adjacent. */
:root {
  --bg-deepest:#fbfaf7; --bg-deep:#f3f1ea; --bg-mid:#eae7de; --bg-light:#e0dcd1; --bg-lighter:#d2cdc0;
  --border-subtle:#e7e2d7; --border-strong:#c2bcac;
  --text-primary:#3b3a40; --text-secondary:#6b6a73; --text-tertiary:#8c8a93;
  --accent-blue:#5b82b8; --accent-blue-hi:#486ea3; --accent-amber:#b48a52;
  --accent-green:#5f9e7e; --accent-red:#bd7780; --accent-purple:#8a76b3;
  --shadow-color:90,85,75; --shadow-strength:.16;
  --c1:#cc7a00; --c2:#1f6fb2; --c3:#2e8b57; --c4:#9b4dca; --c5:#c62d42;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-deepest:#14161d; --bg-deep:#1c1f28; --bg-mid:#262a35; --bg-light:#313643; --bg-lighter:#3d4251;
    --border-subtle:#2c313d; --border-strong:#444a5e;
    --text-primary:#e6e4ea; --text-secondary:#aeb0c0; --text-tertiary:#83879a;
    --accent-blue:#8fb6d9; --accent-blue-hi:#aecce8; --accent-amber:#e6c79c;
    --accent-green:#9ed1b4; --accent-red:#e3a3a8; --accent-purple:#bfaede;
    --shadow-color:0,0,0; --shadow-strength:.5;
    --c1:#bd8322; --c2:#4f90d4; --c3:#2f9d6c; --c4:#a674d6; --c5:#d95a70;
  }
}
:root[data-theme="dark"] {
  --bg-deepest:#14161d; --bg-deep:#1c1f28; --bg-mid:#262a35; --bg-light:#313643; --bg-lighter:#3d4251;
  --border-subtle:#2c313d; --border-strong:#444a5e;
  --text-primary:#e6e4ea; --text-secondary:#aeb0c0; --text-tertiary:#83879a;
  --accent-blue:#8fb6d9; --accent-blue-hi:#aecce8; --accent-amber:#e6c79c;
  --accent-green:#9ed1b4; --accent-red:#e3a3a8; --accent-purple:#bfaede;
  --shadow-color:0,0,0; --shadow-strength:.5;
  --c1:#bd8322; --c2:#4f90d4; --c3:#2f9d6c; --c4:#a674d6; --c5:#d95a70;
}
:root {
  --act:var(--accent-blue); --act-hi:var(--accent-blue-hi);
  --act-tint:color-mix(in srgb, var(--accent-blue) 14%, transparent);
  --focus-ring:0 0 0 2px color-mix(in srgb, var(--accent-blue) 55%, transparent);
  --shadow-float:0 10px 30px rgba(var(--shadow-color), var(--shadow-strength));
  --r-i:6px; --r-s:12px;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme: light dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-deepest);color:var(--text-primary);
     font:400 13px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
body.dropping::after{content:"Drop your CSV";position:fixed;inset:12px;z-index:99;
  border:2px dashed var(--act);border-radius:var(--r-s);background:var(--act-tint);
  display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--act-hi);pointer-events:none}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.rail{background:var(--bg-deep);border-right:1px solid var(--border-subtle);
      padding:18px 15px 40px;display:flex;flex-direction:column;gap:15px;
      position:sticky;top:0;height:100vh;overflow:auto}
.main{padding:22px 26px 90px;min-width:0;display:flex;flex-direction:column;gap:16px}

h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--text-tertiary);font-size:11.5px}
.lede{margin:0;color:var(--text-secondary);max-width:74ch}
.hint{margin:0;color:var(--text-tertiary);font-size:11.5px}
label.field{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
            text-transform:uppercase;color:var(--text-tertiary);margin-bottom:5px}
select,input[type=text],textarea{width:100%;background:var(--bg-deepest);color:var(--text-primary);
  border:1px solid var(--border-strong);border-radius:var(--r-i);padding:7px 9px;font:inherit;font-size:12.5px}
textarea{font-family:var(--font-mono);font-size:11px;min-height:64px;resize:vertical}
.btn{background:var(--bg-mid);color:var(--text-primary);border:1px solid var(--border-strong);
     border-radius:var(--r-i);padding:6px 10px;font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--bg-light)}
.btn.primary{background:var(--act);border-color:var(--act);color:#fff}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}

.picker-list{margin-top:5px;max-height:172px;overflow:auto;border:1px solid var(--border-subtle);
             border-radius:var(--r-i);background:var(--bg-deepest)}
.picker-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 9px;
  font:inherit;font-size:12px;color:var(--text-primary);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-list button:hover{background:var(--bg-mid)}
.picker-list button[aria-selected="true"]{background:var(--act-tint);color:var(--act-hi);font-weight:600}
.picker-list .grp{padding:5px 9px 2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-tertiary);border-top:1px solid var(--border-subtle)}
.picker-list .grp:first-child{border-top:0}

.railbox:empty{display:none}
.railbox{border:1px solid var(--border-subtle);border-radius:var(--r-s);background:var(--bg-deepest);padding:10px 11px}
.railbox h3{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;
            text-transform:uppercase;color:var(--text-tertiary)}
.fam{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;font-size:12px;
     border-top:1px solid var(--border-subtle)}
.fam:first-of-type{border-top:0}
.fam b{font-weight:600;font-family:var(--font-mono);font-size:11.5px}
.fam span{color:var(--text-tertiary);white-space:nowrap;font-variant-numeric:tabular-nums}
details.more>summary{cursor:pointer;font-size:11.5px;color:var(--text-tertiary);margin-top:6px}
/* A family, or an element, opened up to show every box inside it. */
details.famd{border-top:1px solid var(--border-subtle)}
details.famd:first-of-type{border-top:0}
details.famd>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:12px}
details.famd>summary::-webkit-details-marker{display:none}
details.famd>summary::before{content:"▸";color:var(--text-tertiary);font-size:9px;flex:none}
details.famd[open]>summary::before{content:"▾"}
details.famd>summary b{font-weight:600;font-family:var(--font-mono);font-size:11.5px;
  flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.famd>summary span{color:var(--text-tertiary);white-space:nowrap;flex:none;
  font-variant-numeric:tabular-nums}
ul.members{margin:1px 0 7px;padding:0 0 0 11px;border-left:1px solid var(--border-subtle);
  margin-left:5px;max-height:260px;overflow:auto}
ul.members li{list-style:none;font-size:11.5px;color:var(--text-secondary);padding:1px 0}
ul.members li em{font-style:normal;color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}
.empty{max-width:60ch}
.empty h2{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}

/* Masthead + stats */
.stats{display:flex;flex-wrap:wrap;gap:7px}
.stats>div{background:var(--bg-deep);border:1px solid var(--border-subtle);border-radius:var(--r-i);padding:6px 10px;min-width:96px}
.stats .k{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
.stats .v{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px;
          font-family:var(--font-mono)}
.stats .v.good{color:var(--accent-green)}
.note{border-left:3px solid var(--accent-amber);background:var(--bg-deep);padding:9px 12px;
      border-radius:0 var(--r-i) var(--r-i) 0;color:var(--text-secondary);max-width:82ch;font-size:12.5px}

/* View switcher */
.views{display:flex;gap:0;border:1px solid var(--border-strong);border-radius:var(--r-i);
       overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.views button{background:var(--bg-deepest);border:0;border-right:1px solid var(--border-subtle);
  padding:7px 14px;font:inherit;font-size:12.5px;font-weight:500;color:var(--text-secondary);cursor:pointer}
.views button:last-child{border-right:0}
.views button:hover{background:var(--bg-mid);color:var(--text-primary)}
.views button[aria-selected="true"]{background:var(--act);color:#fff}
.viewnote{color:var(--text-secondary);font-size:12.5px;max-width:80ch}
.viewnote b{color:var(--text-primary)}

.stage{border:1px solid var(--border-subtle);border-radius:var(--r-s);background:var(--bg-deepest);
       padding:16px;min-height:340px;overflow:auto}
.busy{color:var(--text-tertiary);padding:26px 0;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;font-size:11.5px;color:var(--text-secondary)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* ── shared element chip ───────────────────────────────────────────────── */
.el{display:inline-flex;align-items:center;gap:6px;background:var(--bg-deep);
    border:1px solid var(--border-subtle);border-radius:var(--r-i);padding:3.5px 9px;font-size:12.5px}
.el.start{background:var(--act-tint);border-color:var(--act);color:var(--act-hi);font-weight:600}
.el.loop{background:color-mix(in srgb,var(--accent-amber) 16%,transparent);border-color:var(--accent-amber)}
.el.folded{border-color:var(--accent-purple)}
.el .x{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-purple);font-weight:600}
.el.loop .x{color:var(--accent-amber)}
.arrow{color:var(--text-tertiary)}

/* ── 1. FLOW ───────────────────────────────────────────────────────────── */
.flowwrap{overflow-x:auto;overflow-y:hidden;position:relative}
.flow text{font-family:var(--font-ui);font-size:10.5px;fill:var(--text-secondary)}
.flow text.big{fill:var(--text-primary);font-weight:600}
.flow .node{fill:var(--act);opacity:.85}
.flow .node.loop{fill:var(--accent-amber)}
.flow .node.start{fill:var(--act-hi)}
.flow .link{fill:var(--act);opacity:.16}
.flow .node:hover{opacity:.95}
.flow g.n{cursor:pointer}
.flow g.n:focus-visible{outline:none}
.flow g.n:focus-visible rect{stroke:var(--act-hi);stroke-width:2.5}
.flow .turn{fill:var(--bg-deepest);font-weight:700;font-size:11px;pointer-events:none}

/* One tangle opened where it stands. The rest of the picture stays put and
   fades back; the ribbons into and out of the tangle come forward, so what is
   on screen is the feedback AND where in the flow it sits. */
.flow.opened .link{opacity:.05}
.flow.opened .link.hot{fill:var(--accent-amber);opacity:.55}
.flow.opened .node:not(.open){opacity:.3}
.flow.opened text{opacity:.45}
.flow.opened g.open text{opacity:1}
.flow .node.open{stroke:var(--text-primary);stroke-width:2;opacity:1}
.flow .lead{stroke:var(--accent-amber);stroke-width:2;fill:none;opacity:.8}
.flow .leadend{fill:var(--accent-amber)}

.loopdrawer{position:absolute;z-index:5;background:var(--bg-deepest);overscroll-behavior:contain;
  border:1px solid var(--accent-amber);border-radius:var(--r-s);
  box-shadow:var(--shadow-float);padding:11px 12px 12px;overflow:auto}
.loopdrawer>header{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.loopdrawer>header b{font-size:13.5px;flex:1 1 auto}
.loopdrawer .m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);
  font-variant-numeric:tabular-nums;margin:0}
.loopdrawer .ctx{margin:5px 0 0;font-size:12px;color:var(--text-secondary)}
.loopdrawer .ctx b{font-weight:600;color:var(--text-primary)}
.loopdrawer .drawerloops{display:grid;gap:9px;margin-top:9px}
.loopdrawer .loopcard{background:var(--bg-deep)}
.closex{background:none;border:0;color:var(--text-tertiary);font:inherit;font-size:12px;
  cursor:pointer;padding:2px 5px;border-radius:4px;flex:none}
.closex:hover{background:var(--bg-mid);color:var(--text-primary)}

/* ── 1b. CIRCLES ───────────────────────────────────────────────────────── */
.circ text{font-family:var(--font-ui);font-size:10.5px;fill:var(--text-secondary);
  paint-order:stroke fill;stroke:var(--bg-deepest);stroke-width:3px;stroke-linejoin:round}
.circ text.big{fill:var(--text-primary);font-weight:600}
.circ .bub{fill:var(--act);opacity:.8}
.circ .bub.start{fill:var(--act-hi)}
.circ .bub.loop{fill:color-mix(in srgb,var(--accent-amber) 60%,transparent);
  stroke:var(--accent-amber);stroke-width:1.4}
.circ .flowline{fill:none;stroke:var(--act);opacity:.2;stroke-linecap:round}
.circ g.n{cursor:pointer}
.circ g.n:hover .bub{opacity:1}
.circ .mini{fill:none;stroke:var(--accent-amber);opacity:.75;stroke-width:1}
.circ .minid{fill:var(--accent-amber);opacity:.5}
.circ.opened .flowline{opacity:.05}
.circ.opened .flowline.hot{stroke:var(--accent-amber);opacity:.6}
.circ.opened .bub:not(.open){opacity:.22}
.circ.opened text{opacity:.4}
.circ.opened g.open text{opacity:1}
.circ .bub.open{stroke:var(--text-primary);stroke-width:2;opacity:1}

/* ── the wheel ─────────────────────────────────────────────────────────── */
svg.wheel{display:block;margin:2px auto 0;touch-action:manipulation}
svg.wheel .ch{fill:none;transition:opacity .18s ease}
svg.wheel .fw{stroke:var(--text-tertiary);opacity:.22;stroke-width:.7}
svg.wheel .nd{fill:var(--act);cursor:pointer;transition:opacity .18s ease}
svg.wheel .nd:hover{stroke:var(--text-primary);stroke-width:1.5}
svg.wheel .nd.on{fill:var(--accent-amber)}
svg.wheel .nd.sel{fill:var(--text-primary);stroke:var(--bg-deepest);stroke-width:2}
svg.wheel .bl{font-family:var(--font-ui);font-size:9px;fill:var(--text-tertiary)}
svg.wheel .bl.on{fill:var(--text-primary);font-weight:600}
svg.wheel.picked .ch{opacity:.06}
svg.wheel.picked .ch.on{opacity:.5}
svg.wheel.picked .nd{opacity:.28}
svg.wheel.picked .nd.on,svg.wheel.picked .nd.sel{opacity:1}
svg.wheel .trace path{fill:none;stroke-linecap:round}
svg.wheel .hub{fill:var(--text-tertiary);font-family:var(--font-mono);font-size:10px;text-anchor:middle}

.wheelfoot{margin-top:8px;border-top:1px solid var(--border-subtle);padding-top:9px}
.wheelfoot select{width:100%;background:var(--bg-deepest);color:var(--text-primary);
  border:1px solid var(--border-strong);border-radius:var(--r-i);padding:5px 7px;font:inherit;font-size:12px}
.wheelfoot .cap{margin:8px 0 0;font-size:12.5px;color:var(--text-secondary)}
.wheelfoot .cap b{color:var(--text-primary)}
.wheelfoot .chain{margin:6px 0 0;font-size:11.5px;color:var(--text-secondary);
  display:flex;flex-wrap:wrap;gap:3px 5px;align-items:center}
.wheelfoot .chain i{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary)}
.wheelfoot .chain em{font-style:normal;padding:1px 5px;border-radius:4px;background:var(--bg-mid)}
.wheelfoot .chain em.head{background:color-mix(in srgb,var(--accent-amber) 26%,transparent)}

/* ── 2. LOOPS ──────────────────────────────────────────────────────────── */
.loopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px}
.loopcard{border:1px solid var(--border-subtle);border-left:4px solid var(--c2);
  border-radius:var(--r-s);background:var(--bg-deep);padding:10px 12px 12px}
.loopcard.r{border-left-color:var(--c1)}
.loopcard header{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:2px}
.loopcard .pol{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c2)}
.loopcard .pol.r{color:var(--c1)}
.loopcard .m{font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);
  font-variant-numeric:tabular-nums}
.loopcard .hint{margin-top:6px}
svg.ring{display:block;height:auto}
svg.ring .lk{stroke:var(--border-strong);stroke-width:1.6;fill:none}
svg.ring .ah{fill:var(--border-strong)}
svg.ring .bx{fill:var(--bg-deepest);stroke:var(--text-secondary);stroke-width:1.6}
svg.ring .bl{font-family:var(--font-ui);font-size:9.5px;fill:var(--text-secondary)}
svg.ring .sg{font-family:var(--font-mono);font-size:13px;font-weight:600;fill:var(--text-primary);text-anchor:middle}
svg.ring .rb{font-family:var(--font-ui);font-size:26px;font-weight:700;fill:var(--c2);opacity:.85}
svg.ring .rb.r{fill:var(--c1)}
.flatloop{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0 2px}
.flatloop .back{font-size:11px;color:var(--text-tertiary);font-family:var(--font-mono)}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--bg-deepest);color:var(--text-primary);
  border:1px solid var(--border-strong);border-radius:var(--r-i);padding:6px 9px;font-size:12px;
  box-shadow:var(--shadow-float);max-width:280px;display:none}
.tip b{display:block;font-size:12.5px}
.tip span{color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}

@media (max-width:900px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div>
      <h1>Pathway Atlas</h1>
      <p class="sub" id="map-summary">no map loaded</p>
    </div>

    <div>
      <label class="field">Your map</label>
      <div class="row-btns" style="margin-bottom:7px">
        <button class="btn primary" id="pick-file">Choose CSV…</button>
        <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
      </div>
      <textarea id="csv-in" placeholder="…or paste the CSV here"></textarea>
      <div class="row-btns" style="margin-top:6px"><button class="btn" id="load-csv">Load pasted text</button></div>
      <p class="hint" id="csv-status" style="margin-top:6px">You can also drag a file anywhere onto this page.</p>
    </div>

    <div id="start-wrap" hidden>
      <label class="field" for="start-q">Start from</label>
      <input type="text" id="start-q" placeholder="Type to filter boxes…" autocomplete="off">
      <div class="picker-list" id="start-list"></div>
    </div>

    <div class="row-btns"><button class="btn" id="theme-btn">Theme</button></div>

    <div class="railbox" id="lane-box"></div>
    <div class="railbox" id="detail-box" hidden></div>
  </aside>

  <main class="main">
    <div class="stats" id="stats"></div>
    <div id="warn"></div>
    <nav class="views" id="views" role="tablist" aria-label="How to read the atlas">
      <button role="tab" data-v="flow">Flow</button>
      <button role="tab" data-v="circles">Circles</button>
      <button role="tab" data-v="loops">Loops</button>
    </nav>
    <p class="viewnote" id="viewnote"></p>
    <div class="stage" id="stage"></div>
  </main>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
// ===========================================================================
// READING THE APP'S CSV
// ===========================================================================
function splitCsvLine(line) {
  const out = [];
  let cur = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quoted) {
      if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') quoted = false;
      else cur += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function parseAriadneCsv(text) {
  const sections = {};
  let current = null, headers = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^#\s*SECTION:\s*(\w+)/i);
    if (m) { current = m[1].toLowerCase(); sections[current] = []; headers = null; continue; }
    if (line.startsWith("#") || !current) continue;
    const cells = splitCsvLine(line);
    if (!headers) { headers = cells.map(c => c.trim().toLowerCase()); continue; }
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cells[i] ?? "").trim(); });
    sections[current].push(obj);
  }
  const streamLabel = {}, catLabel = {};
  for (const s of sections.streams || []) streamLabel[s.id] = s.label || s.id;
  for (const c of sections.categories || []) catLabel[c.id] = c.label || c.id;
  const nodes = (sections.nodes || []).map(r => ({
    id: r.id, label: r.label || r.id,
    stream: streamLabel[r.stream] || r.stream || "",
    category: catLabel[(r.category || "").split(/[;|]/)[0]] || r.category || "",
    controllable: r.controllable === "true", direction: r.direction || "",
  }));
  const known = new Set(nodes.map(n => n.id));
  const defaults = { enables: 0.30, increases: 0.25, decreases: -0.25 };
  for (const d of sections.defaults || []) {
    if (d.key === "elasticity_enables") defaults.enables = parseFloat(d.value);
    if (d.key === "elasticity_increases") defaults.increases = parseFloat(d.value);
    if (d.key === "elasticity_decreases") defaults.decreases = parseFloat(d.value);
  }
  const edges = (sections.edges || [])
    .filter(r => known.has(r.from) && known.has(r.to))
    .map(r => {
      const raw = parseFloat(r.elasticity);
      const effect = r.effect || "increases";
      return { from: r.from, to: r.to, effect, elasticity: isNaN(raw) ? (defaults[effect] ?? 0.25) : raw };
    });
  return { nodes, edges, name: "your map" };
}

// ATLAS-ENGINE-START (kept verbatim; tests/pathway-atlas.test.ts reads it from here)
// ===========================================================================
// PATHWAY ATLAS ENGINE
// ---------------------------------------------------------------------------
// The move this is built on: never enumerate pathways.
//
// The complete set of pathways from a box is already written down in the graph
// itself — it is the subgraph of everything that box can reach. Enumerating it
// turns a linear amount of information into an exponential amount of paper. So
// we never do. Each step below rewrites that subgraph into a smaller one that
// stands for the same pathways, and the counts come from arithmetic over the
// structure rather than from tallying things as we walk past them.
//
//   scope      keep only what the start box can reach
//   loops      contract each feedback loop to a single element
//   name       propose a grouping from the box names
//   refine     split any group whose members do not behave alike
//   decompose  cut the result into single-entry / single-exit regions
//   count      exact totals by dynamic programming (BigInt)
//
// Nothing is sampled, capped, budgeted or truncated at any point, so "every
// pathway is represented" is a property of the construction rather than a hope.
//
// TWO GUARANTEES, and the refine step is what buys the second one:
//
//   complete  every pathway in the map is one of the readings on screen, so an
//             impact cannot be missed however far it meanders
//   sound     every reading on screen is a pathway that really exists
//
// Grouping by name alone gives the first and quietly breaks the second. Fold
// "Cannabis Seizure" and "Cocaine Seizure" into one "◇ Seizure" and the page
// starts offering "Cannabis Import → ◇ Seizure → Cocaine Testing" — a sentence
// no route in the map actually says. So a proposed group is kept only while
// its members agree on which groups they lead to; where they disagree it is
// split, and that split is worth reading, because it is the map saying this is
// where the lanes stop behaving alike.
// ===========================================================================

const SLOT = "◇";        // stands in for whatever varies between lanes
const END = "\u0000END";      // virtual finish, so every pathway has one
const SEP = "\u0001";                // never appears in a label

// ---------------------------------------------------------------------------
// 0. GRAPH
// ---------------------------------------------------------------------------
function buildGraph(map) {
  const byId = new Map(), out = new Map(), inc = new Map();
  for (const n of map.nodes) { byId.set(n.id, n); out.set(n.id, []); inc.set(n.id, []); }
  const edges = [];
  for (const e of map.edges) {
    if (!byId.has(e.from) || !byId.has(e.to)) continue;
    edges.push(e);
    out.get(e.from).push(e);
    inc.get(e.to).push(e);
  }
  return { nodes: map.nodes, edges, byId, out, inc, name: map.name || "map" };
}

function reachableFrom(G, startId, stopAt) {
  const seen = new Set([startId]), stack = [startId];
  while (stack.length) {
    const id = stack.pop();
    if (stopAt && id !== startId && stopAt.has(id)) continue;
    for (const e of G.out.get(id) || []) if (!seen.has(e.to)) { seen.add(e.to); stack.push(e.to); }
  }
  return seen;
}

// ---------------------------------------------------------------------------
// 1. NAME GROUPING
// ---------------------------------------------------------------------------
// A LANE is one value of a dimension the map repeats itself along — Cannabis,
// Cocaine, Cat A, Cat B. A ROLE is what a box does once its lane is stripped
// off: "Cat ◇ Targets".
//
// The family key is a PREFIX and a SUFFIX rather than one word position, so
// the varying part can run to several words and can differ in length between
// members: "Class A Drug Seizure" and "Cannabis Seizure" share the key
// (prefix "", suffix "Seizure").
//
// Four tests, because label similarity on its own invents families:
//   size       a family needs enough members to be a pattern, not a coincidence
//   adjacency  lane members are ALTERNATIVES, so none is linked to another —
//              a sequence (Import → Seizure → Testing) fails this
//   reuse      a lane value must play its part in more than one role, so a
//              single coincidental pair cannot mint a lane
//   role       members must sit in the same part of the map: what flows into
//              and out of them has to play overlapping parts
//
// Everything here is only a PROPOSAL. Step 3 checks it against behaviour.
// ---------------------------------------------------------------------------
const LANE_DEFAULTS = {
  minMembers: 3,          // how many boxes make a family
  minTokenFamilies: 2,    // a lane value must appear in this many roles
  maxSpan: 3,             // how many words the varying part may run to
  neighbourOverlap: 0.25, // how alike members' surroundings must be
};

const words = s => String(s).split(/\s+/).filter(Boolean);

function candidateFamilies(nodes, maxSpan) {
  const byKey = new Map();
  for (const n of nodes) {
    const w = words(n.label || n.id);
    for (let i = 0; i < w.length; i++) {
      for (let j = i + 1; j <= Math.min(w.length, i + maxSpan); j++) {
        const pre = w.slice(0, i), suf = w.slice(j);
        if (pre.length + suf.length === 0) continue;   // need something to anchor on
        const key = pre.join(" ") + SEP + suf.join(" ");
        let m = byKey.get(key);
        if (!m) byKey.set(key, m = new Map());
        if (!m.has(n.id)) m.set(n.id, w.slice(i, j).join(" "));
      }
    }
  }
  return byKey;
}

function detectLanes(nodes, edges, opts = {}) {
  const o = { ...LANE_DEFAULTS, ...opts };
  if (!o.minMembers) return {
    roleOf: new Map(nodes.map(n => [n.id, "N:" + n.id])), laneOf: new Map(),
    families: [], laneValues: new Set(), rejected: [], foldedBoxes: 0, roleCount: nodes.length,
  };

  const linked = new Set();
  for (const e of edges) { linked.add(e.from + SEP + e.to); linked.add(e.to + SEP + e.from); }

  const rejected = [], pool = [];
  for (const [key, m] of candidateFamilies(nodes, o.maxSpan)) {
    if (m.size < o.minMembers) continue;
    const members = [...m].map(([id, token]) => ({ id, token }));
    if (new Set(members.map(x => x.token)).size !== members.length) continue;

    let adjacent = false;
    for (let i = 0; i < members.length && !adjacent; i++)
      for (let j = i + 1; j < members.length && !adjacent; j++)
        if (linked.has(members[i].id + SEP + members[j].id)) adjacent = true;
    if (adjacent) { rejected.push({ key, why: "members are linked to each other, so this is a sequence not a set of alternatives" }); continue; }

    const [pre, suf] = key.split(SEP);
    pool.push({ key, pre, suf, members, anchor: words(pre).length + words(suf).length });
  }

  // Lane values and families define each other, so settle them together.
  let kept = pool;
  for (let round = 0; round < 6; round++) {
    const tokenFamilies = new Map();
    for (const f of kept)
      for (const t of new Set(f.members.map(m => m.token)))
        tokenFamilies.set(t, (tokenFamilies.get(t) || 0) + 1);
    const values = new Set([...tokenFamilies]
      .filter(([t, c]) => c >= o.minTokenFamilies && !/^[0-9]+$/.test(t) && t.length > 1)
      .map(([t]) => t));
    const next = pool
      .map(f => ({ ...f, members: f.members.filter(m => values.has(m.token)) }))
      .filter(f => f.members.length >= o.minMembers);
    const settled = next.length === kept.length &&
      next.every((f, i) => f.key === kept[i].key && f.members.length === kept[i].members.length);
    kept = next;
    if (settled) break;
  }

  // Bigger family wins a contested box; more anchor words breaks the tie.
  const assign = list => {
    const roleOf = new Map(), laneOf = new Map(), claimed = new Set();
    for (const f of [...list].sort((a, b) =>
      b.members.length - a.members.length || b.anchor - a.anchor || (a.key < b.key ? -1 : 1)))
      for (const m of f.members) {
        if (claimed.has(m.id)) continue;
        claimed.add(m.id);
        roleOf.set(m.id, "L:" + f.key);
        laneOf.set(m.id, m.token);
      }
    return { roleOf, laneOf };
  };

  // "Pick rate" and "Damage rate" share a word and nothing else; real lane
  // siblings sit in the same place in the map, so what flows into and out of
  // them plays the same parts.
  const tentative = assign(kept);
  const around = new Map();
  for (const e of edges) {
    if (!around.has(e.from)) around.set(e.from, new Set());
    if (!around.has(e.to)) around.set(e.to, new Set());
    around.get(e.from).add(tentative.roleOf.get(e.to) || "N:" + e.to);
    around.get(e.to).add(tentative.roleOf.get(e.from) || "N:" + e.from);
  }
  const survivors = [];
  for (const f of kept) {
    const mine = f.members.filter(m => tentative.roleOf.get(m.id) === "L:" + f.key);
    if (mine.length < o.minMembers) continue;
    const sets = mine.map(m => around.get(m.id) || new Set());
    let pairs = 0, total = 0;
    for (let i = 0; i < sets.length; i++)
      for (let j = i + 1; j < sets.length; j++) {
        let inter = 0;
        for (const r of sets[i]) if (sets[j].has(r)) inter++;
        const union = sets[i].size + sets[j].size - inter;
        total += union ? inter / union : 0;
        pairs++;
      }
    const overlap = pairs ? total / pairs : 1;
    if (overlap < o.neighbourOverlap) {
      rejected.push({ key: f.key, why: `members sit in different parts of the map (${(overlap * 100).toFixed(0)}% shared surroundings)` });
      continue;
    }
    survivors.push({ ...f, members: mine, overlap });
  }

  const { roleOf, laneOf } = assign(survivors);
  for (const n of nodes) if (!roleOf.has(n.id)) roleOf.set(n.id, "N:" + n.id);

  const size = new Map();
  for (const role of roleOf.values()) size.set(role, (size.get(role) || 0) + 1);

  return {
    roleOf, laneOf, rejected,
    families: survivors
      .map(f => ({ ...f, members: f.members.filter(m => roleOf.get(m.id) === "L:" + f.key) }))
      .filter(f => f.members.length >= o.minMembers)
      .sort((a, b) => b.members.length - a.members.length),
    laneValues: new Set(laneOf.values()),
    foldedBoxes: [...size.values()].filter(c => c > 1).reduce((a, c) => a + c, 0),
    roleCount: size.size,
  };
}

const familyLabel = key => {
  const [pre, suf] = key.split(SEP);
  return (pre ? pre + " " : "") + SLOT + (suf ? " " + suf : "");
};

function roleLabel(role, byId) {
  if (!role.startsWith("L:")) {
    const n = byId.get(role.slice(2));
    return n ? (n.label || n.id) : role.slice(2);
  }
  return familyLabel(role.slice(2));
}

// ---------------------------------------------------------------------------
// 2. FEEDBACK LOOPS
// ---------------------------------------------------------------------------
// Every mutually-reachable group of boxes becomes one element. A pathway can
// enter a loop and leave it, but never go round it — which is how people read
// a strand, and what leaves the rest of the pipeline working on something
// guaranteed to be acyclic.
// ---------------------------------------------------------------------------
function stronglyConnected(ids, succ) {
  const index = new Map(), low = new Map(), onStack = new Set(), stack = [], comps = [];
  let counter = 0;
  for (const root of ids) {
    if (index.has(root)) continue;
    const work = [{ v: root, kids: null, i: 0 }];
    while (work.length) {
      const f = work[work.length - 1];
      if (f.kids === null) {
        index.set(f.v, counter); low.set(f.v, counter); counter++;
        stack.push(f.v); onStack.add(f.v);
        f.kids = [...(succ.get(f.v) || [])];
      }
      if (f.i < f.kids.length) {
        const w = f.kids[f.i++];
        if (!index.has(w)) work.push({ v: w, kids: null, i: 0 });
        else if (onStack.has(w)) low.set(f.v, Math.min(low.get(f.v), index.get(w)));
        continue;
      }
      if (low.get(f.v) === index.get(f.v)) {
        const comp = [];
        for (;;) { const w = stack.pop(); onStack.delete(w); comp.push(w); if (w === f.v) break; }
        comps.push(comp);
      }
      work.pop();
      if (work.length) {
        const p = work[work.length - 1].v;
        low.set(p, Math.min(low.get(p), low.get(f.v)));
      }
    }
  }
  return comps;
}

function collapseLoops(scope, edges) {
  const succ = new Map();
  for (const id of scope) succ.set(id, new Set());
  for (const e of edges) if (scope.has(e.from) && scope.has(e.to)) succ.get(e.from).add(e.to);

  const groupOf = new Map(), groups = new Map();
  let n = 0;
  for (const comp of stronglyConnected([...scope], succ)) {
    const loop = comp.length > 1 || succ.get(comp[0]).has(comp[0]);
    const id = "g" + (n++);
    for (const b of comp) groupOf.set(b, id);
    groups.set(id, { id, loop, boxes: comp });
  }
  const gsucc = new Map(), gpred = new Map();
  for (const id of groups.keys()) { gsucc.set(id, new Set()); gpred.set(id, new Set()); }
  for (const [a, outs] of succ)
    for (const b of outs) {
      const x = groupOf.get(a), y = groupOf.get(b);
      if (x === y) continue;
      gsucc.get(x).add(y); gpred.get(y).add(x);
    }
  return { groups, groupOf, succ: gsucc, pred: gpred };
}

// ---------------------------------------------------------------------------
// 2b. WHAT IS ACTUALLY INSIDE A FEEDBACK LOOP
// ---------------------------------------------------------------------------
// Contracting a tangle to one element keeps the counting honest, but on its own
// it turns the most interesting part of a map into a black box. One tangle on a
// map this size held 108 boxes and 79 independent loops, and the only thing the
// page said about it was 108 names joined by arrows.
//
// A tangle is not one loop. It is many loops sharing edges, and the unit people
// actually think in is the single loop with its POLARITY:
//
//   reinforcing  an even number of negative links — a nudge comes back amplified
//   balancing    an odd number — a nudge comes back opposed, and it settles
//
// Both fall straight out of the elasticities already in the CSV: multiply the
// signs for polarity, multiply the magnitudes for gain. Neither was being used.
//
// Which loops to show is the real question, because a tangle can hold more
// loops than anyone will read. Taking the SHORTEST loop through each box, then
// ranking by gain, gives a set with two properties worth having: no box in the
// tangle is left without a story, and the ones that actually move the system
// come first.
// ---------------------------------------------------------------------------
function shortestCycleThrough(box, adj) {
  if ((adj.get(box) || []).some(e => e.to === box)) return [box];
  const prev = new Map(), queue = [];
  for (const e of adj.get(box) || [])
    if (!prev.has(e.to)) { prev.set(e.to, box); queue.push(e.to); }
  for (let head = 0; head < queue.length; head++) {
    const n = queue[head];
    for (const e of adj.get(n) || []) {
      if (e.to === box) {
        const path = [n];
        for (let x = prev.get(n); x !== box; x = prev.get(x)) path.push(x);
        path.push(box);
        return path.reverse();
      }
      if (!prev.has(e.to)) { prev.set(e.to, n); queue.push(e.to); }
    }
  }
  return null;
}

// Rotations of one loop are the same loop, so name each by the rotation that
// starts at its first box alphabetically.
function canonicalCycle(cycle) {
  let k = 0;
  for (let i = 1; i < cycle.length; i++) if (cycle[i] < cycle[k]) k = i;
  return cycle.slice(k).concat(cycle.slice(0, k)).join(">");
}

function analyseTangle(boxes, edges, outsideIn, outsideOut) {
  const set = new Set(boxes);
  const inner = edges.filter(e => set.has(e.from) && set.has(e.to));

  // Two boxes can be joined twice, and the two links can disagree about sign —
  // in which case the polarity of every loop through them depends on which one
  // you take. Taking whichever happened to be listed first would make the
  // answer silently arbitrary, so the stronger link wins and the count of
  // disagreements is reported rather than swallowed.
  const strongest = new Map();
  let parallel = 0, contradictory = 0;
  for (const e of inner) {
    const key = e.from + "\u0001" + e.to;
    const had = strongest.get(key);
    if (!had) { strongest.set(key, e); continue; }
    parallel++;
    if ((had.elasticity < 0) !== (e.elasticity < 0)) contradictory++;
    if (Math.abs(e.elasticity) > Math.abs(had.elasticity)) strongest.set(key, e);
  }
  const adj = new Map(boxes.map(b => [b, []]));
  for (const e of strongest.values()) adj.get(e.from).push(e);

  const loops = [], seen = new Set();
  for (const box of boxes) {
    const cycle = shortestCycleThrough(box, adj);
    if (!cycle) continue;
    const key = canonicalCycle(cycle);
    if (seen.has(key)) continue;
    seen.add(key);
    let sign = 1, gain = 1;
    const links = [];
    for (let i = 0; i < cycle.length; i++) {
      const from = cycle[i], to = cycle[(i + 1) % cycle.length];
      const e = adj.get(from).find(x => x.to === to);
      if (!e) { sign = 0; break; }
      links.push(e);
      sign *= e.elasticity < 0 ? -1 : 1;
      gain *= Math.abs(e.elasticity);
    }
    if (!sign) continue;
    loops.push({ key, cycle, links, sign, gain, reinforcing: sign > 0 });
  }
  loops.sort((a, b) => b.gain - a.gain || a.cycle.length - b.cycle.length);

  return {
    boxes, loops,
    links: [...strongest.values()],
    linkCount: inner.length,
    parallel, contradictory,
    // How many loops it would take to generate every loop in here. The plain
    // count of loops can run to thousands; this one is small and exact.
    independent: inner.length - boxes.length + 1,
    waysIn: [...outsideIn], waysOut: [...outsideOut],
    reinforcing: loops.filter(l => l.reinforcing).length,
    balancing: loops.filter(l => !l.reinforcing).length,
  };
}

// ---------------------------------------------------------------------------
// 2b. THE WHEEL — an order that makes a tangle drawable
// ---------------------------------------------------------------------------
// A tangle is not a random knot. Order its boxes well and MOST of its links run
// forwards; only a few run back, and those few are the feedback — cut them and
// what is left is an ordinary sequence. That is what makes the tangle drawable
// as one picture: the back links are few enough to see.
//
// Worth keeping two numbers apart. The loops of a tangle span a space of
// E − V + 1 independent ones, which on a real tangle runs to dozens and is why
// listing them fails. The links that must be cut to make it acyclic are far
// fewer. The second number is the one you can draw.
//
// The ordering is the greedy feedback-arc-set of Eades, Lin and Smyth: peel
// sinks off the back and sources off the front, and when neither exists take
// the box with the biggest out-minus-in. Linear, and in practice within a hair
// of the smallest possible set of back links.
// ---------------------------------------------------------------------------
function orderTangle(boxes, links) {
  const outD = new Map(), inD = new Map(), outs = new Map(), ins = new Map();
  for (const b of boxes) { outD.set(b, 0); inD.set(b, 0); outs.set(b, []); ins.set(b, []); }
  for (const e of links) {
    if (!outD.has(e.from) || !inD.has(e.to)) continue;
    outD.set(e.from, outD.get(e.from) + 1); inD.set(e.to, inD.get(e.to) + 1);
    outs.get(e.from).push(e.to); ins.get(e.to).push(e.from);
  }
  const left = [], right = [], gone = new Set();
  const drop = v => {
    gone.add(v);
    for (const w of outs.get(v)) if (!gone.has(w)) inD.set(w, inD.get(w) - 1);
    for (const w of ins.get(v)) if (!gone.has(w)) outD.set(w, outD.get(w) - 1);
  };
  while (gone.size < boxes.length) {
    let moved = true;
    while (moved) {
      moved = false;
      for (const v of boxes) if (!gone.has(v) && outD.get(v) === 0) { right.unshift(v); drop(v); moved = true; }
      for (const v of boxes) if (!gone.has(v) && inD.get(v) === 0 && outD.get(v) > 0) { left.push(v); drop(v); moved = true; }
    }
    if (gone.size >= boxes.length) break;
    let best = null, score = -Infinity;
    for (const v of boxes) {
      if (gone.has(v)) continue;
      const s = outD.get(v) - inD.get(v);
      if (s > score) { score = s; best = v; }
    }
    left.push(best); drop(best);
  }
  return left.concat(right);
}

// Everything the wheel is drawn from. Computed when a tangle is opened rather
// than when the atlas is built, so a map full of feedback still builds in the
// time it takes to draw one frame.
function wheelOf(t) {
  const order = orderTangle(t.boxes, t.links);
  const pos = new Map(order.map((b, i) => [b, i]));
  const forward = [], back = [];
  for (const e of t.links) (pos.get(e.to) > pos.get(e.from) ? forward : back).push(e);

  // The forward links alone are acyclic, so the way home from a back link is a
  // shortest path in a DAG — no search, just relax in order. A few back links
  // cannot get home that way, because their return needs another back link;
  // those fall back to a plain search, so every back link gets its loop.
  const fwdOut = new Map(t.boxes.map(b => [b, []]));
  for (const e of forward) fwdOut.get(e.from).push(e);
  const allOut = new Map(t.boxes.map(b => [b, []]));
  for (const e of t.links) allOut.get(e.from).push(e);

  const loops = [];
  for (const e of back) {
    const dist = new Map([[e.to, 0]]), prev = new Map();
    for (const b of order) {
      if (!dist.has(b)) continue;
      for (const f of fwdOut.get(b))
        if (!dist.has(f.to) || dist.get(f.to) > dist.get(b) + 1) {
          dist.set(f.to, dist.get(b) + 1); prev.set(f.to, f);
        }
    }
    let chain = [];
    if (dist.has(e.from)) {
      for (let at = e.from; at !== e.to; ) { const f = prev.get(at); chain.unshift(f); at = f.from; }
    } else {
      const seen = new Map(), q = [e.to];
      for (let i = 0; i < q.length; i++)
        for (const f of allOut.get(q[i]) || []) {
          if (seen.has(f.to) || f.to === e.to) continue;
          seen.set(f.to, f); q.push(f.to);
        }
      if (!seen.has(e.from)) continue;
      for (let at = e.from; at !== e.to; ) { const f = seen.get(at); chain.unshift(f); at = f.from; }
    }
    const links = chain.concat([e]);
    let sign = 1, gain = 1;
    for (const l of links) { if (l.elasticity < 0) sign = -sign; gain *= Math.abs(l.elasticity); }
    loops.push({ back: e, links, cycle: links.map(l => l.from), reinforcing: sign > 0, gain });
  }

  const share = new Map(t.boxes.map(b => [b, 0]));
  for (const l of loops) for (const b of l.cycle) share.set(b, share.get(b) + 1);
  const touching = new Map(t.boxes.map(b => [b, []]));
  for (const e of t.links) { touching.get(e.from).push(e); touching.get(e.to).push(e); }

  return { order, pos, forward, back, loops, share, touching, links: t.links };
}

// ---------------------------------------------------------------------------
// 3. REFINE THE GROUPING UNTIL IT IS TRUE
// ---------------------------------------------------------------------------
// Start from what the names propose, then repeatedly split any group whose
// members disagree about which groups they lead to. What settles out is the
// coarsest grouping in which members really are interchangeable going forward.
//
// Two things follow, and both matter:
//   * every stretch on the page is walkable in the real map, because each
//     member of a group has a successor in every one of that group's
//     successors;
//   * the result cannot hold a loop the map does not, because a loop among
//     groups would force an endless forward chain through an acyclic graph.
//     Grouping by name alone offers no such assurance — it will happily turn
//     "Cannabis Seizure → Shared Factor → Cocaine Import" into feedback that
//     nobody drew.
// ---------------------------------------------------------------------------
// Both settings run the same refinement; they differ only in when to stop.
//
//   as far as possible  stop the moment the grouping is loop-safe. This is the
//                       most condensed honest answer: no invented feedback, but
//                       a group may hold members that go on to differ, and the
//                       lane badges on each branch are what tell you so.
//   where behaviour matches  run to the fixpoint. Every step on the page is
//                       then one that every member of its group really takes.
//                       Strictly truer, and on a map whose lanes are wired
//                       even slightly differently it condenses far less.
//
// Neither can miss a pathway. The difference is only how much is claimed about
// the members of a group, which is why the tool reports both numbers.
function quotientHasCycle(ids, succ, cls) {
  const csucc = new Map();
  for (const id of ids) {
    const c = cls.get(id);
    if (!csucc.has(c)) csucc.set(c, new Set());
  }
  for (const id of ids) {
    const c = cls.get(id);
    for (const s of succ.get(id)) {
      const d = cls.get(s);
      if (d === c) return true;
      csucc.get(c).add(d);
    }
  }
  return stronglyConnected([...csucc.keys()], csucc).some(comp => comp.length > 1);
}

function refineForward(ids, succ, initial, strict) {
  let cls = new Map(ids.map(id => [id, String(initial.get(id))]));
  let count = new Set(cls.values()).size;
  for (let round = 0; round <= ids.length + 1; round++) {
    if (!strict && !quotientHasCycle(ids, succ, cls)) return { cls, rounds: round, settled: false };
    const sig = new Map(), rename = new Map();
    for (const id of ids) {
      const outs = [...new Set([...succ.get(id)].map(x => cls.get(x)))].sort().join(",");
      sig.set(id, cls.get(id) + SEP + outs);
    }
    for (const id of ids) if (!rename.has(sig.get(id))) rename.set(sig.get(id), "c" + rename.size);
    if (rename.size === count) return { cls, rounds: round, settled: true };
    cls = new Map(ids.map(id => [id, rename.get(sig.get(id))]));
    count = rename.size;
  }
  return { cls, rounds: ids.length, settled: true };
}

// ---------------------------------------------------------------------------
// 4. POST-DOMINATORS → single-entry / single-exit regions
// ---------------------------------------------------------------------------
// Where the pathways split, the question worth answering is where they come
// back together. That element is the immediate POST-DOMINATOR of the split:
// the first one every route from the split must reach. Everything between the
// two is a self-contained choice — exactly the unit worth putting on screen
// behind one open/close triangle.
// ---------------------------------------------------------------------------
function reversePostorder(root, succOf) {
  const seen = new Set([root]), post = [], stack = [{ n: root, kids: null, i: 0 }];
  while (stack.length) {
    const f = stack[stack.length - 1];
    if (f.kids === null) f.kids = succOf(f.n);
    if (f.i < f.kids.length) {
      const s = f.kids[f.i++];
      if (!seen.has(s)) { seen.add(s); stack.push({ n: s, kids: null, i: 0 }); }
      continue;
    }
    post.push(f.n); stack.pop();
  }
  return post.reverse();
}

function immediateDominators(root, succOf, predOf) {
  const rpo = reversePostorder(root, succOf);
  const num = new Map(rpo.map((n, i) => [n, i]));
  const idom = new Map([[root, root]]);
  const intersect = (a, b) => {
    while (a !== b) {
      while (num.get(a) > num.get(b)) a = idom.get(a);
      while (num.get(b) > num.get(a)) b = idom.get(b);
    }
    return a;
  };
  for (let changed = true; changed;) {
    changed = false;
    for (const n of rpo) {
      if (n === root) continue;
      let cand = null;
      for (const p of predOf(n)) {
        if (!num.has(p) || !idom.has(p)) continue;
        cand = cand === null ? p : intersect(p, cand);
      }
      if (cand !== null && idom.get(n) !== cand) { idom.set(n, cand); changed = true; }
    }
  }
  return idom;
}

// Exact totals: paths(n) is how many pathways run from n to the finish, summed
// over successors in reverse topological order. BigInt, because on a real map
// this number is genuinely astronomical.
function countPaths(start, succOf) {
  const topo = reversePostorder(start, succOf);
  const paths = new Map([[END, 1n]]);
  for (let i = topo.length - 1; i >= 0; i--) {
    const n = topo[i];
    if (n === END) continue;
    let total = 0n;
    for (const s of succOf(n)) total += paths.get(s) || 0n;
    paths.set(n, total);
  }
  return paths;
}

function addFinish(succ, pred) {
  succ.set(END, new Set());
  if (pred) pred.set(END, new Set());
  const finishes = [];
  for (const [id, outs] of succ) {
    if (id === END || outs.size) continue;
    finishes.push(id);
    outs.add(END);
    if (pred) pred.get(END).add(id);
  }
  return finishes;
}

// ---------------------------------------------------------------------------
// 5. THE ATLAS
// ---------------------------------------------------------------------------
function buildAtlas(G, startId, opts = {}) {
  const t0 = Date.now();
  const stopAt = opts.stopAtOutcomes
    ? new Set(G.nodes.filter(n => n.direction).map(n => n.id))
    : null;

  const scope = reachableFrom(G, startId, stopAt);
  const scopedNodes = G.nodes.filter(n => scope.has(n.id));
  const scopedEdges = G.edges.filter(e =>
    scope.has(e.from) && scope.has(e.to) &&
    !(stopAt && stopAt.has(e.from) && e.from !== startId));

  const lanes = detectLanes(scopedNodes, scopedEdges, opts.lanes || {});
  const L = collapseLoops(scope, scopedEdges);
  const startGroup = L.groupOf.get(startId);

  // What the names propose. Identical loops in different lanes get the same
  // proposal, so four copies of one feedback loop become one element.
  const initial = new Map();
  for (const [gid, g] of L.groups) {
    if (gid === startGroup) { initial.set(gid, "START"); continue; }
    const roles = [...new Set(g.boxes.map(b => lanes.roleOf.get(b)))].sort();
    initial.set(gid, g.loop ? "LOOP:" + roles.join("+") : roles[0]);
  }

  // Unpack every tangle once, before anything is folded, so polarity and gain
  // are read off the real links rather than off the grouped ones.
  const tangles = new Map();
  for (const [gid, g] of L.groups) {
    if (!g.loop) continue;
    const set = new Set(g.boxes);
    const inSide = new Set(), outSide = new Set();
    for (const e of scopedEdges) {
      if (!set.has(e.from) && set.has(e.to)) inSide.add(e.to);
      if (set.has(e.from) && !set.has(e.to)) outSide.add(e.from);
    }
    tangles.set(gid, analyseTangle(g.boxes, scopedEdges, inSide, outSide));
  }

  const gids = [...L.groups.keys()];
  const refined = refineForward(gids, L.succ, initial, opts.grouping === "strict");
  const classOf = refined.cls;

  // The quotient: one element per settled class.
  const nodes = new Map(), succ = new Map(), pred = new Map();
  for (const gid of gids) {
    const cid = classOf.get(gid);
    let node = nodes.get(cid);
    if (!node) {
      nodes.set(cid, node = { id: cid, loop: false, boxes: [], lanes: new Set(), copies: 0, roles: new Set(), tangles: [] });
      succ.set(cid, new Set()); pred.set(cid, new Set());
    }
    const g = L.groups.get(gid);
    node.copies++;
    node.loop = node.loop || g.loop;
    if (g.loop && tangles.has(gid)) node.tangles.push(tangles.get(gid));
    for (const b of g.boxes) {
      node.boxes.push(b);
      node.roles.add(lanes.roleOf.get(b));
      const lane = lanes.laneOf.get(b);
      if (lane) node.lanes.add(lane);
    }
  }
  // Which lanes actually take each step, and which do not. On the looser
  // setting this is the whole story of where the strands differ, so it is
  // recorded rather than inferred.
  const stepLanes = new Map(), stepTakenBy = new Map();
  for (const [a, outs] of L.succ)
    for (const b of outs) {
      const x = classOf.get(a), y = classOf.get(b);
      if (x === y) continue;
      succ.get(x).add(y); pred.get(y).add(x);
      const key = x + ">" + y;
      if (!stepLanes.has(key)) { stepLanes.set(key, new Set()); stepTakenBy.set(key, new Set()); }
      stepTakenBy.get(key).add(a);
      for (const box of L.groups.get(a).boxes) {
        const lane = lanes.laneOf.get(box);
        if (lane) stepLanes.get(key).add(lane);
      }
    }

  // How many steps on the page are taken by only some members of their group.
  // Zero on the strict setting by construction; on the looser one this is the
  // honest measure of what the condensation is glossing over.
  let partialSteps = 0;
  const membersOf = new Map();
  for (const gid of gids) {
    const c = classOf.get(gid);
    membersOf.set(c, (membersOf.get(c) || 0) + 1);
  }
  for (const [key, takers] of stepTakenBy)
    if (takers.size < membersOf.get(key.split(">")[0])) partialSteps++;
  for (const node of nodes.values()) {
    const roles = [...node.roles];
    node.label = node.loop
      ? loopLabel(node, G)
      : roles.length === 1 && node.boxes.length > 1
        ? roleLabel(roles[0], G.byId)
        : (G.byId.get(node.boxes[0]) || {}).label || node.boxes[0];
  }

  const start = classOf.get(startGroup);
  nodes.set(END, { id: END, label: "end", loop: false, boxes: [], lanes: new Set(), copies: 0, roles: new Set(), end: true });
  const finishes = addFinish(succ, pred);
  const succOf = n => [...succ.get(n)];
  const predOf = n => [...pred.get(n)];
  const ipdom = immediateDominators(END, predOf, succOf);
  const paths = countPaths(start, succOf);

  // The same structure with no grouping at all, so the condensation is
  // measured rather than asserted and the true pathway total is to hand.
  const rawSucc = new Map();
  for (const gid of gids) rawSucc.set(gid, new Set(L.succ.get(gid)));
  addFinish(rawSucc, null);
  const rawPaths = countPaths(startGroup, n => [...rawSucc.get(n)]);

  const ctx = { nodes, ipdom, paths, succ: succOf, END,
                limit: nodes.size + 8, emitted: new Set(), tails: new Map() };
  const tree = buildSequence(start, END, ctx);

  // Where a proposed family had to be split because its members stopped
  // behaving alike. Not a failure — this is the divergence, named.
  const splits = new Map();
  for (const [gid, cid] of classOf) {
    const proposal = initial.get(gid);
    if (!proposal.startsWith("L:")) continue;
    if (!splits.has(proposal)) splits.set(proposal, new Set());
    splits.get(proposal).add(cid);
  }

  return {
    startId, start, tree, nodes, succ, pred, ipdom, paths, lanes, scope, finishes,
    tails: ctx.tails, stepLanes, stepTakenBy,
    grouping: opts.grouping === "strict" ? "strict" : "loose",
    everyStepShared: partialSteps === 0,
    partialSteps, totalSteps: stepTakenBy.size,
    loops: [...nodes.values()].filter(n => n.loop),
    feedback: gatherFeedback(nodes),
    shapes: paths.get(start) || 0n,
    pathways: rawPaths.get(startGroup) || 0n,
    boxesInScope: scope.size,
    elements: nodes.size - 1,
    elementsUngrouped: gids.length,
    splitFamilies: [...splits]
      .filter(([, s]) => s.size > 1)
      .map(([role, s]) => ({ key: role.slice(2), into: s.size }))
      .sort((a, b) => b.into - a.into),
    refineRounds: refined.rounds,
    ms: Date.now() - t0,
  };
}

// A loop is named after its strongest loop when that is short enough to read,
// and by its size when it is not. Reciting 108 member names, which is what this
// used to do, is the opposite of a name.
function loopLabel(node, G) {
  const t = node.tangles[0];
  if (!t || !t.loops.length) return `feedback loop of ${node.boxes.length} boxes`;
  // One loop can be named after itself. A tangle of many cannot — naming it
  // after the strongest implies the others are variations on it, and they are
  // not, so it is named by what it is instead.
  if (t.loops.length === 1)
    return t.loops[0].cycle.map(b => (G.byId.get(b) || {}).label || b).join(" ⇄ ");
  return `feedback tangle · ${t.loops.length} loops`;
}

// Walk the spine from `entry` to `stop`, opening a nested choice wherever the
// pathways split. Progress is guaranteed: a split's rejoin is always strictly
// later in the order than the split itself.
//
// Two alternatives out of one split can pass through the same element without
// ALL of them doing so — n→a→m→x, n→a→q→x, n→b→m→x. Writing m out under both
// would duplicate the stretch, and on a dense map that duplication compounds
// until the page is larger than the graph it came from. So an element is
// expanded once and later meetings point at it. Nothing is lost: the two
// readings continue identically from there.
function buildSequence(entry, stop, ctx) {
  const items = [];
  let n = entry, guard = 0;
  while (n !== stop && n !== ctx.END) {
    if (guard++ > ctx.limit) throw new Error("region walk failed to terminate at " + n);
    if (ctx.emitted.has(n)) { items.push({ kind: "join", id: n }); break; }
    ctx.emitted.add(n);
    items.push({ kind: "box", id: n });
    const outs = ctx.succ(n);
    if (outs.length === 0) break;
    if (outs.length === 1) { n = outs[0]; continue; }
    const rejoin = ctx.ipdom.get(n);
    const whole = ctx.paths.get(rejoin) || 1n;
    const alts = outs.map(s => ({
      first: s,
      shapes: (ctx.paths.get(s) || 0n) / whole,
      seq: s === rejoin ? [] : buildSequence(s, rejoin, ctx),
    })).sort((a, b) => (a.shapes > b.shapes ? -1 : a.shapes < b.shapes ? 1 : 0));
    items.push({ kind: "choice", at: n, rejoin: rejoin === ctx.END ? null : rejoin, alts });
    n = rejoin;
  }
  // What follows each element, so a "joins here" reads as the stretch it
  // points at rather than as a dead end.
  for (let i = 0; i < items.length; i++)
    if (items[i].kind === "box") ctx.tails.set(items[i].id, items.slice(i));
  return items;
}

// ---------------------------------------------------------------------------
// 6. READING AIDS
// ---------------------------------------------------------------------------
// Which lanes reach a stretch. One only some lanes can reach is a real
// divergence — the pocket where those lanes behave unlike the rest.
function lanesIn(seq, nodes, into = new Set()) {
  for (const item of seq) {
    if (item.kind === "choice") for (const a of item.alts) lanesIn(a.seq, nodes, into);
    else for (const l of nodes.get(item.id).lanes || []) into.add(l);
  }
  return into;
}

function boxesIn(seq, nodes, into = new Set()) {
  for (const item of seq) {
    if (item.kind === "choice") for (const a of item.alts) boxesIn(a.seq, nodes, into);
    else for (const b of nodes.get(item.id).boxes || []) into.add(b);
  }
  return into;
}

function countItems(seq, acc = { boxes: 0, choices: 0, joins: 0, depth: 0 }, depth = 0) {
  acc.depth = Math.max(acc.depth, depth);
  for (const item of seq) {
    if (item.kind === "box") acc.boxes++;
    else if (item.kind === "join") acc.joins++;
    else { acc.choices++; for (const a of item.alts) countItems(a.seq, acc, depth + 1); }
  }
  return acc;
}

function formatCount(n) {
  if (typeof n !== "bigint") n = BigInt(n);
  if (n < 1000000000000000n) return Number(n).toLocaleString("en-GB");
  const s = n.toString();
  return s[0] + "." + s.slice(1, 3) + " × 10^" + (s.length - 1);
}

// Every loop on the map in one list, strongest first, each knowing which
// element it lives in and how many places that element stands for.
function gatherFeedback(nodes) {
  const out = [];
  for (const node of nodes.values()) {
    if (!node.loop || !node.tangles.length) continue;
    const t = node.tangles[0];
    for (const loop of t.loops)
      out.push({ ...loop, element: node.id, elementLabel: node.label,
                 copies: node.tangles.length, lanes: node.lanes,
                 tangleSize: t.boxes.length, independent: t.independent });
  }
  return out.sort((a, b) => b.gain - a.gain || a.cycle.length - b.cycle.length);
}
// ATLAS-ENGINE-END

// ===========================================================================
// READING THE ATLAS
// ---------------------------------------------------------------------------
// Six presentations were prototyped — proportional blocks, parallel strands, a
// lane grid, one step at a time, a nested outline — and Flow won: the whole
// atlas as one picture, with nothing to open and nothing to read in order.
// Loops keeps its own tab until the two are drawn as a single picture.
//
// Both are driven by exactly the same atlas — nothing is recomputed or
// approximated per view, so switching between them cannot change the answer.
// ===========================================================================
let G = null, ATLAS = null, START = null, QUERY = "", VIEW = "flow";
let LOOP_SORT = "gain";   // Loops: how the cards are ordered
let OPEN_LOOP = null;     // Flow: which tangle is unfurled where it stands

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, many) => (n === 1 ? one : many || one + "s");
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
const labelOf = id => (ATLAS.nodes.get(id) || {}).label || id;

// ---------------------------------------------------------------------------
// MEASUREMENTS THE VIEWS SHARE
// ---------------------------------------------------------------------------
// paths(n) is how many readings run from n to the finish. Going the other way
// gives how many run from the start into n, and multiplying the two gives the
// weight of n: how much of everything passes through it. That single number is
// what makes a flow diagram, a proportional block and a bar all say the same
// thing rather than three different things.
function measure(A) {
  const succOf = n => [...A.succ.get(n)];
  const order = reversePostorder(A.start, succOf);
  const into = new Map([[A.start, 1n]]);
  const depth = new Map([[A.start, 0]]);
  for (const n of order) {
    const i = into.get(n) || 0n, d = depth.get(n) || 0;
    for (const s of succOf(n)) {
      into.set(s, (into.get(s) || 0n) + i);
      if ((depth.get(s) || 0) < d + 1) depth.set(s, d + 1);
    }
  }
  const total = A.paths.get(A.start) || 1n;
  const share = v => (total > 0n ? Number((v * 1000000n) / total) / 1000000 : 0);
  return {
    order, into, depth, total,
    weight: n => share((into.get(n) || 0n) * (A.paths.get(n) || 0n)),
    linkWeight: (a, b) => share((into.get(a) || 0n) * (A.paths.get(b) || 0n)),
  };
}

const pct = f => (f >= 0.1 ? (f * 100).toFixed(0) : f >= 0.001 ? (f * 100).toFixed(1) : "<0.1") + "%";

// ---------------------------------------------------------------------------
// 1. FLOW — the whole thing as one picture
// ---------------------------------------------------------------------------
// Columns are how far along a pathway you are; the height of a block and the
// thickness of a ribbon are how much runs through it. Nothing to read in order:
// the shape of the answer is the picture.
//
// Feedback opens where it stands. A tangle is one amber block, and clicking it
// unfurls its loops beside it rather than sending you to another tab: the
// picture stays exactly where it was, the ribbons into and out of the tangle
// come forward in amber, and everything else fades back. Feedback read on its
// own is a diagram; feedback read next to what feeds it is an explanation.
// ---------------------------------------------------------------------------
const DRAWER_W = 520;
function viewFlow(A, M) {
  const COL_W = 190, PAD = 26, H = Math.max(520, Math.min(1100, A.elements * 7));
  const cols = [];
  for (const [id] of A.nodes) {
    if (id === END) continue;
    const d = M.depth.get(id);
    if (d === undefined) continue;
    (cols[d] || (cols[d] = [])).push(id);
  }
  const used = cols.filter(Boolean);
  if (!used.length) return `<p class="busy">Nothing to draw.</p>`;

  // Order each column near the average height of what feeds it, twice over, so
  // the ribbons cross as little as they are going to without real effort.
  const y = new Map(), h = new Map();
  const place = () => {
    for (const col of used) {
      const totalW = col.reduce((a, id) => a + Math.max(M.weight(id), 0.0004), 0);
      const gap = Math.min(9, (H - 2 * PAD) / (col.length * 2 + 1));
      const avail = H - 2 * PAD - gap * (col.length - 1);
      let cur = PAD;
      for (const id of col) {
        const hh = Math.max(5, (Math.max(M.weight(id), 0.0004) / totalW) * avail);
        y.set(id, cur); h.set(id, hh);
        cur += hh + gap;
      }
    }
  };
  place();
  for (let pass = 0; pass < 2; pass++) {
    for (let c = 1; c < used.length; c++) {
      used[c].sort((a, b) => bary(a) - bary(b));
    }
    place();
  }
  function bary(id) {
    const ps = [...A.pred.get(id)].filter(p => y.has(p));
    if (!ps.length) return y.get(id) || 0;
    return ps.reduce((s, p) => s + (y.get(p) + h.get(p) / 2), 0) / ps.length;
  }

  const W = PAD + used.length * COL_W;
  const parts = [];
  const open = OPEN_LOOP && A.nodes.has(OPEN_LOOP) && A.nodes.get(OPEN_LOOP).loop ? OPEN_LOOP : null;
  // Ribbons first, so the blocks sit on top of them.
  for (const [a, outs] of A.succ) {
    if (a === END || !y.has(a)) continue;
    let offA = 0;
    for (const b of outs) {
      if (b === END || !y.has(b)) continue;
      const w = M.linkWeight(a, b);
      const t = Math.max(1.2, w * (H - 2 * PAD) * 0.9);
      const x1 = PAD + M.depth.get(a) * COL_W + 13;
      const x2 = PAD + M.depth.get(b) * COL_W;
      const y1 = y.get(a) + Math.min(offA + t / 2, h.get(a));
      const y2 = y.get(b) + h.get(b) / 2;
      const mx = (x1 + x2) / 2;
      offA += t;
      parts.push(`<path class="link${open && (a === open || b === open) ? " hot" : ""}" d="M${x1} ${y1 - t / 2}C${mx} ${y1 - t / 2} ${mx} ${y2 - t / 2} ${x2} ${y2 - t / 2}` +
        `L${x2} ${y2 + t / 2}C${mx} ${y2 + t / 2} ${mx} ${y1 + t / 2} ${x1} ${y1 + t / 2}Z"></path>`);
    }
  }
  for (const col of used) for (const id of col) {
    const node = A.nodes.get(id);
    const x = PAD + M.depth.get(id) * COL_W;
    const hh = h.get(id), yy = y.get(id), w = M.weight(id);
    const cls = "node" + (id === A.start ? " start" : node.loop ? " loop" : "") +
      (id === open ? " open" : "");
    const showLabel = hh >= 11;
    // A tangle is a button, and says so, because the one thing you can do to
    // this picture is open one.
    const act = node.loop
      ? ` tabindex="0" role="button" aria-expanded="${id === open}"` +
        ` aria-label="Feedback: ${node.boxes.length} boxes. Open its loops."`
      : "";
    parts.push(`<g class="n${id === open ? " open" : ""}" data-el="${esc(id)}"${
        node.loop ? ' data-loop="1"' : ""} data-w="${pct(w)}"${act}>` +
      `<rect class="${cls}" x="${x}" y="${yy}" width="13" height="${hh}" rx="3"></rect>` +
      (node.loop && hh < 16
        ? `<rect fill="transparent" x="${x - 4}" y="${yy + hh / 2 - 9}" width="21" height="18"></rect>` : "") +
      (node.loop && hh >= 17 ? `<text class="turn" x="${x + 6.5}" y="${yy + hh / 2 + 4}" text-anchor="middle">↻</text>` : "") +
      (showLabel && id !== open
        ? `<text class="${hh > 20 ? "big" : ""}" x="${x + 19}" y="${yy + hh / 2 + 3.5}">` +
          (node.loop ? "↻ " : "") + esc(clip(node.label, 22)) +
          (node.boxes.length > 1 && !node.loop ? " ×" + node.boxes.length : "") + `</text>`
        : "") + `</g>`);
  }

  // The drawer is placed in the picture's own coordinates — the SVG is drawn at
  // 1 unit per pixel and shares the wrapper's scroll — so it stays pinned to
  // its block rather than floating over the middle of the screen.
  let drawer = "", wrapStyle = "";
  if (open) {
    const bx = PAD + M.depth.get(open) * COL_W, by = y.get(open), bh = h.get(open);
    const toRight = bx + 56 + DRAWER_W <= W - 4;
    const px = toRight ? bx + 56 : Math.max(6, bx - 44 - DRAWER_W);
    // The wheel wants more height than a short map's picture has. Rather than
    // squeezing it, the drawer keeps its size and the wrapper grows to hold it
    // — see fitDrawer, which measures the real thing once it is in the page.
    const dh = 860;
    const py = Math.max(10, Math.min(Math.max(10, H - dh - 10), by + bh / 2 - dh / 2));
    const sx = toRight ? bx + 13 : bx, sy = by + bh / 2;
    const ex = toRight ? px : px + DRAWER_W;
    const ey = Math.max(py + 22, Math.min(py + dh - 22, sy));
    const mx = (sx + ex) / 2;
    parts.push(`<path class="lead" d="M${sx} ${sy}C${mx} ${sy} ${mx} ${ey} ${ex} ${ey}"></path>`);
    parts.push(`<circle class="leadend" cx="${sx}" cy="${sy}" r="3.5"></circle>`);
    drawer = loopDrawer(open, A, `left:${px}px;top:${py}px;width:${DRAWER_W}px;max-height:${dh}px`);
    wrapStyle = ` style="min-height:${py + dh + 14}px"`;
  }

  return `<div class="legend">
      <span><i style="background:var(--act)"></i>an element — height is how much of everything runs through it</span>
      <span><i style="background:var(--accent-amber)"></i>↻ feedback — click it to open its loops here</span>
      <span>ribbon thickness is the same measure, for a step</span>
    </div>
    <div class="flowwrap"${wrapStyle}><svg class="flow${open ? " opened" : ""}" width="${W}" height="${H}" role="img"
      aria-label="Flow diagram of every pathway downstream of ${esc(labelOf(A.start))}">${parts.join("")}</svg>${drawer}</div>`;
}

// What a tangle is, where it sits, and every loop in it — beside the block it
// belongs to. The ways in and out are named from the picture itself, so the
// answer to "what feeds this" is in the same panel as "what goes round".
function loopDrawer(id, A, style) {
  const node = A.nodes.get(id);
  const t = node.tangles[0];
  // One element can stand for the same tangle in several lanes. The wheel is
  // one copy's worth — saying "2 boxes" of an element covering four copies of
  // them would be wrong, and summing them into "8 boxes" would be wronger.
  const copies = node.tangles.length;
  const sum = k => node.tangles.reduce((a, x) => a + (Array.isArray(x[k]) ? x[k].length : x[k]), 0);
  const w = wheelFor(id, t);
  WHEEL_TANGLE = t;
  const r = w.loops.filter(l => l.reinforcing).length;
  const names = set => {
    const list = [...set].filter(x => x !== END).map(labelOf);
    if (!list.length) return "";
    return list.slice(0, 2).map(n => `<b>${esc(clip(n, 22))}</b>`).join(", ") +
      (list.length > 2 ? ` +${list.length - 2}` : "");
  };
  const from = names(A.pred.get(id) || new Set()), to = names(A.succ.get(id) || new Set());
  const byLoops = [...t.boxes].sort((a, b) => (w.share.get(b) - w.share.get(a)) ||
    (boxLabel(a) < boxLabel(b) ? -1 : 1));
  return `<aside class="loopdrawer" style="${style}">
    <header><b>↻ Feedback here</b>
      <button class="closex" type="button" data-closeloop>Close</button></header>
    <p class="m">${t.boxes.length} ${plural(t.boxes.length, "box", "boxes")}${
      copies > 1 ? ` in each of ${copies} places` : ""} · ${w.back.length}
      ${plural(w.back.length, "link")} back · ${r}R / ${w.loops.length - r}B${
      t.independent > w.loops.length ? ` · ${t.independent} independent` : ""}</p>
    <p class="ctx">${from ? `From ${from}.` : "Nothing upstream in this scope."}
      ${to ? `Into ${to}.` : "Nothing leaves it."}
      <span class="m">${sum("waysIn")} in, ${sum("waysOut")} out${
        sum("contradictory") ? ` · ${sum("contradictory")} contradictory` : ""}</span></p>
    ${wheelSvg(w)}
    <div class="wheelfoot">
      <select id="wheel-pick" aria-label="Pick a box in the tangle">
        <option value="">Pick a box — or click one on the rim</option>
        ${byLoops.map(b => `<option value="${esc(b)}"${b === WHEEL_PICK ? " selected" : ""}>${
          esc(clip(boxLabel(b), 40))} — in ${w.share.get(b)} ${plural(w.share.get(b), "loop")}</option>`).join("")}
      </select>
      <div id="wheel-cap"></div>
    </div>
  </aside>`;
}

// ---------------------------------------------------------------------------
// 1b. CIRCLES — the same atlas, drawn as area rather than height
// ---------------------------------------------------------------------------
// Flow says how much runs through an element with the height of a bar. This
// says it with the area of a circle. The reason to prefer it is not the
// encoding — a bar is easier to compare than a disc — but the shape: a tangle
// of feedback IS a circle, so here it can be drawn as a small wheel sitting in
// the flow, and opening it is a zoom rather than a change of subject.
//
// Left-to-right is still how far along a pathway you are. That much is worth
// keeping: it is the only thing on the page that says which way round the
// story goes.
// ---------------------------------------------------------------------------
const MINI_RIM = 26;      // rim dots on a tangle drawn small
const MINI_CH = 12;       // and chords across it

function viewCircles(A, M) {
  const COL_W = 162, PAD = 34, H = Math.max(520, Math.min(1150, A.elements * 7));
  const open = OPEN_LOOP && A.nodes.has(OPEN_LOOP) && A.nodes.get(OPEN_LOOP).loop ? OPEN_LOOP : null;
  const cols = [];
  for (const [id] of A.nodes) {
    if (id === END) continue;
    const d = M.depth.get(id);
    if (d === undefined) continue;
    (cols[d] || (cols[d] = [])).push(id);
  }
  const used = cols.filter(Boolean);
  if (!used.length) return `<p class="busy">Nothing to draw.</p>`;

  // Area is the measure, so the radius is its square root. One scale for the
  // whole picture, set by whichever column is fullest — otherwise two circles
  // of the same size in different columns would mean different things.
  const sq = id => Math.sqrt(Math.max(M.weight(id), 0.000015));
  let k = Infinity;
  for (const col of used) {
    const sum = col.reduce((a, id) => a + sq(id), 0);
    k = Math.min(k, (H - 2 * PAD - 6 * (col.length - 1)) / (2 * sum));
  }
  k = Math.min(k, 52 / Math.max(...used.flat().map(sq)));
  const rOf = id => Math.max(2.6, k * sq(id));

  const y = new Map();
  const place = () => {
    for (const col of used) {
      const need = col.reduce((a, id) => a + 2 * rOf(id), 0);
      const room = H - 2 * PAD - need;
      const gap = Math.max(3, Math.min(26, room / Math.max(1, col.length - 1)));
      let cur = PAD + Math.max(0, (room - gap * (col.length - 1)) / 2);
      for (const id of col) { y.set(id, cur + rOf(id)); cur += 2 * rOf(id) + gap; }
    }
  };
  place();
  const bary = id => {
    const ps = [...A.pred.get(id)].filter(q => y.has(q));
    return ps.length ? ps.reduce((a, q) => a + y.get(q), 0) / ps.length : y.get(id) || 0;
  };
  for (let pass = 0; pass < 2; pass++) {
    for (let c = 1; c < used.length; c++) used[c].sort((a, b) => bary(a) - bary(b));
    place();
  }
  const x = id => PAD + M.depth.get(id) * COL_W + 26;

  const parts = [];
  for (const [a, outs] of A.succ) {
    if (a === END || !y.has(a)) continue;
    for (const b of outs) {
      if (b === END || !y.has(b)) continue;
      const x1 = x(a) + rOf(a), x2 = x(b) - rOf(b), y1 = y.get(a), y2 = y.get(b);
      // A line as wide as the circles it joins stops reading as a line. Thick
      // enough to compare, never thick enough to become the picture.
      const t = Math.max(0.6, Math.min(26, 0.9 * Math.min(rOf(a), rOf(b)),
        M.linkWeight(a, b) * H * 0.55));
      const mx = (x1 + x2) / 2;
      parts.push(`<path class="flowline${open && (a === open || b === open) ? " hot" : ""}"
        stroke-width="${t.toFixed(2)}" d="M${x1.toFixed(1)} ${y1.toFixed(1)}C${mx.toFixed(1)} ${
        y1.toFixed(1)} ${mx.toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}"></path>`);
    }
  }
  for (const col of used) for (const id of col) {
    const node = A.nodes.get(id), r = rOf(id), cx = x(id), cy = y.get(id);
    const cls = "bub" + (id === A.start ? " start" : node.loop ? " loop" : "") + (id === open ? " open" : "");
