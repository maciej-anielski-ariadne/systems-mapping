<!DOCTYPE html>
<!--
================================================================================
 Pathway Atlas — a standalone analysis tool for Ariadne Maps.

 NOT part of the app. Open this file directly in a browser and drop in the CSV
 the app's CSV button saves. Everything runs locally in the page; nothing is
 uploaded anywhere.

 THE PROBLEM. Pick a box on a big map and ask what it leads to, and the honest
 answer can be millions of routes. Listing them is hopeless, and walking them
 all — what the earlier strand-condenser does — runs out of memory at around
 twenty million.

 THE IDEA. Do not walk them. The complete set of pathways from a box is already
 written down in the map: it is the subgraph of everything that box can reach.
 Enumerating it converts a linear amount of information into an exponential
 amount of paper. So this tool never enumerates. It rewrites that subgraph into
 a smaller one standing for the same pathways, and gets the counts by arithmetic
 over the structure.

   scope      keep only what the start box can reach
   loops      contract each feedback loop to a single element
   name       propose a grouping from the box names
   refine     split any group whose members do not behave alike
   decompose  cut the result into single-entry / single-exit regions
   count      exact totals, by dynamic programming, in arbitrary precision

 Nothing is sampled, capped, budgeted or truncated at any point.

 SIX WAYS TO READ IT. The structure is one thing; how you look at it is another,
 and a nested list of names and arrows turns out to be the hardest of the six.
 The view switcher offers the same atlas as a flow diagram, proportional blocks,
 parallel strands, a lane grid, one step at a time, and the outline.

 See tools/PATHWAY-ATLAS.md for how it works and what it was measured against.
================================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathway Atlas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%2314161d'/><path d='M5 19V9h5V5h9' fill='none' stroke='%23bfaede' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/><path d='M10 9h6' fill='none' stroke='%238fb6d9' stroke-width='1.8' stroke-linecap='round'/><circle cx='5' cy='19' r='2' fill='%23bfaede'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* Tokens lifted from the app's 01-variables.css so this reads as part of
   Ariadne. Light (Linen) is the base; Twilight (dark) overrides it.
   The chart hues are separate and deliberate: Ariadne's accents are muted on
   purpose, which is right on a map and wrong for telling five lines apart, so
   the strand colours below are the same hues pushed to a chroma that survives
   colour-blind simulation, ordered so no red/green/amber pair sits adjacent. */
:root {
  --bg-deepest:#fbfaf7; --bg-deep:#f3f1ea; --bg-mid:#eae7de; --bg-light:#e0dcd1; --bg-lighter:#d2cdc0;
  --border-subtle:#e7e2d7; --border-strong:#c2bcac;
  --text-primary:#3b3a40; --text-secondary:#6b6a73; --text-tertiary:#8c8a93;
  --accent-blue:#5b82b8; --accent-blue-hi:#486ea3; --accent-amber:#b48a52;
  --accent-green:#5f9e7e; --accent-red:#bd7780; --accent-purple:#8a76b3;
  --shadow-color:90,85,75; --shadow-strength:.16;
  --c1:#cc7a00; --c2:#1f6fb2; --c3:#2e8b57; --c4:#9b4dca; --c5:#c62d42;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-deepest:#14161d; --bg-deep:#1c1f28; --bg-mid:#262a35; --bg-light:#313643; --bg-lighter:#3d4251;
    --border-subtle:#2c313d; --border-strong:#444a5e;
    --text-primary:#e6e4ea; --text-secondary:#aeb0c0; --text-tertiary:#83879a;
    --accent-blue:#8fb6d9; --accent-blue-hi:#aecce8; --accent-amber:#e6c79c;
    --accent-green:#9ed1b4; --accent-red:#e3a3a8; --accent-purple:#bfaede;
    --shadow-color:0,0,0; --shadow-strength:.5;
    --c1:#bd8322; --c2:#4f90d4; --c3:#2f9d6c; --c4:#a674d6; --c5:#d95a70;
  }
}
:root[data-theme="dark"] {
  --bg-deepest:#14161d; --bg-deep:#1c1f28; --bg-mid:#262a35; --bg-light:#313643; --bg-lighter:#3d4251;
  --border-subtle:#2c313d; --border-strong:#444a5e;
  --text-primary:#e6e4ea; --text-secondary:#aeb0c0; --text-tertiary:#83879a;
  --accent-blue:#8fb6d9; --accent-blue-hi:#aecce8; --accent-amber:#e6c79c;
  --accent-green:#9ed1b4; --accent-red:#e3a3a8; --accent-purple:#bfaede;
  --shadow-color:0,0,0; --shadow-strength:.5;
  --c1:#bd8322; --c2:#4f90d4; --c3:#2f9d6c; --c4:#a674d6; --c5:#d95a70;
}
:root {
  --act:var(--accent-blue); --act-hi:var(--accent-blue-hi);
  --act-tint:color-mix(in srgb, var(--accent-blue) 14%, transparent);
  --focus-ring:0 0 0 2px color-mix(in srgb, var(--accent-blue) 55%, transparent);
  --shadow-float:0 10px 30px rgba(var(--shadow-color), var(--shadow-strength));
  --r-i:6px; --r-s:12px;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme: light dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-deepest);color:var(--text-primary);
     font:400 13px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
body.dropping::after{content:"Drop your CSV";position:fixed;inset:12px;z-index:99;
  border:2px dashed var(--act);border-radius:var(--r-s);background:var(--act-tint);
  display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--act-hi);pointer-events:none}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.rail{background:var(--bg-deep);border-right:1px solid var(--border-subtle);
      padding:18px 15px 40px;display:flex;flex-direction:column;gap:15px;
      position:sticky;top:0;height:100vh;overflow:auto}
.main{padding:22px 26px 90px;min-width:0;display:flex;flex-direction:column;gap:16px}

h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--text-tertiary);font-size:11.5px}
.lede{margin:0;color:var(--text-secondary);max-width:74ch}
.hint{margin:0;color:var(--text-tertiary);font-size:11.5px}
label.field{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;
            text-transform:uppercase;color:var(--text-tertiary);margin-bottom:5px}
select,input[type=text],textarea{width:100%;background:var(--bg-deepest);color:var(--text-primary);
  border:1px solid var(--border-strong);border-radius:var(--r-i);padding:7px 9px;font:inherit;font-size:12.5px}
textarea{font-family:var(--font-mono);font-size:11px;min-height:64px;resize:vertical}
.btn{background:var(--bg-mid);color:var(--text-primary);border:1px solid var(--border-strong);
     border-radius:var(--r-i);padding:6px 10px;font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--bg-light)}
.btn.primary{background:var(--act);border-color:var(--act);color:#fff}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.check{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text-secondary);cursor:pointer}
.check input{margin-top:2px}

.picker-list{margin-top:5px;max-height:172px;overflow:auto;border:1px solid var(--border-subtle);
             border-radius:var(--r-i);background:var(--bg-deepest)}
.picker-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 9px;
  font:inherit;font-size:12px;color:var(--text-primary);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-list button:hover{background:var(--bg-mid)}
.picker-list button[aria-selected="true"]{background:var(--act-tint);color:var(--act-hi);font-weight:600}
.picker-list .grp{padding:5px 9px 2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-tertiary);border-top:1px solid var(--border-subtle)}
.picker-list .grp:first-child{border-top:0}

.railbox{border:1px solid var(--border-subtle);border-radius:var(--r-s);background:var(--bg-deepest);padding:10px 11px}
.railbox h3{margin:0 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.08em;
            text-transform:uppercase;color:var(--text-tertiary)}
.fam{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;font-size:12px;
     border-top:1px solid var(--border-subtle)}
.fam:first-of-type{border-top:0}
.fam b{font-weight:600;font-family:var(--font-mono);font-size:11.5px}
.fam span{color:var(--text-tertiary);white-space:nowrap;font-variant-numeric:tabular-nums}
details.more>summary{cursor:pointer;font-size:11.5px;color:var(--text-tertiary);margin-top:6px}

/* Masthead + stats */
.stats{display:flex;flex-wrap:wrap;gap:7px}
.stats>div{background:var(--bg-deep);border:1px solid var(--border-subtle);border-radius:var(--r-i);padding:6px 10px;min-width:96px}
.stats .k{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-tertiary)}
.stats .v{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px;
          font-family:var(--font-mono)}
.stats .v.good{color:var(--accent-green)}
.note{border-left:3px solid var(--accent-amber);background:var(--bg-deep);padding:9px 12px;
      border-radius:0 var(--r-i) var(--r-i) 0;color:var(--text-secondary);max-width:82ch;font-size:12.5px}

/* View switcher */
.views{display:flex;gap:0;border:1px solid var(--border-strong);border-radius:var(--r-i);
       overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.views button{background:var(--bg-deepest);border:0;border-right:1px solid var(--border-subtle);
  padding:7px 14px;font:inherit;font-size:12.5px;font-weight:500;color:var(--text-secondary);cursor:pointer}
.views button:last-child{border-right:0}
.views button:hover{background:var(--bg-mid);color:var(--text-primary)}
.views button[aria-selected="true"]{background:var(--act);color:#fff}
.viewnote{color:var(--text-secondary);font-size:12.5px;max-width:80ch}
.viewnote b{color:var(--text-primary)}

.stage{border:1px solid var(--border-subtle);border-radius:var(--r-s);background:var(--bg-deepest);
       padding:16px;min-height:340px;overflow:auto}
.busy{color:var(--text-tertiary);padding:26px 0;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;font-size:11.5px;color:var(--text-secondary)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}

/* ── shared element chip ───────────────────────────────────────────────── */
.el{display:inline-flex;align-items:center;gap:6px;background:var(--bg-deep);
    border:1px solid var(--border-subtle);border-radius:var(--r-i);padding:3.5px 9px;font-size:12.5px}
.el.start{background:var(--act-tint);border-color:var(--act);color:var(--act-hi);font-weight:600}
.el.loop{background:color-mix(in srgb,var(--accent-amber) 16%,transparent);border-color:var(--accent-amber)}
.el.folded{border-color:var(--accent-purple)}
.el .x{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-purple);font-weight:600}
.el.loop .x{color:var(--accent-amber)}
.arrow{color:var(--text-tertiary)}

/* ── 1. FLOW ───────────────────────────────────────────────────────────── */
.flowwrap{overflow-x:auto;overflow-y:hidden}
.flow text{font-family:var(--font-ui);font-size:10.5px;fill:var(--text-secondary)}
.flow text.big{fill:var(--text-primary);font-weight:600}
.flow .node{fill:var(--act);opacity:.85}
.flow .node.loop{fill:var(--accent-amber)}
.flow .node.start{fill:var(--act-hi)}
.flow .link{fill:var(--act);opacity:.16}
.flow .node:hover,.flow .link.hot{opacity:.95}
.flow g.n{cursor:pointer}

/* ── 2. BLOCKS ─────────────────────────────────────────────────────────── */
.crumbs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:0 0 12px;font-size:12px}
.crumbs button{background:none;border:0;color:var(--act-hi);cursor:pointer;font:inherit;padding:2px 4px;
  border-radius:4px;text-decoration:underline;text-underline-offset:2px}
.crumbs button:hover{background:var(--act-tint)}
.crumbs span{color:var(--text-tertiary)}
.band{display:flex;gap:2px;margin-bottom:2px}
.blk{flex:0 1 auto;min-width:0;border-radius:4px;padding:6px 8px;overflow:hidden;cursor:pointer;
     border:1px solid transparent;position:relative}
.blk:hover{border-color:var(--act)}
.blk .bl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500}
.blk .bc{display:block;font-family:var(--font-mono);font-size:10px;opacity:.75;font-variant-numeric:tabular-nums}
.blk.d0{background:color-mix(in srgb,var(--act) 40%,var(--bg-deepest))}
.blk.d1{background:color-mix(in srgb,var(--act) 30%,var(--bg-deepest))}
.blk.d2{background:color-mix(in srgb,var(--act) 22%,var(--bg-deepest))}
.blk.d3{background:color-mix(in srgb,var(--act) 15%,var(--bg-deepest))}
.blk.d4{background:color-mix(in srgb,var(--act) 9%,var(--bg-deepest))}
.blk.seg{background:var(--bg-mid);cursor:default}
.blk.seg:hover{border-color:transparent}
.blk.loopy{background:color-mix(in srgb,var(--accent-amber) 30%,var(--bg-deepest))}
.stack{margin-bottom:9px}

/* ── 3. STRANDS ────────────────────────────────────────────────────────── */
.strand{display:grid;grid-template-columns:auto 1fr;gap:0 14px;align-items:stretch}
.rail-line{position:relative;width:26px}
.rail-line::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:4px;
  background:var(--border-strong);border-radius:2px}
.stop{display:flex;align-items:center;gap:10px;padding:5px 0;position:relative}
.dot{position:absolute;left:-27px;width:12px;height:12px;border-radius:50%;background:var(--bg-deepest);
     border:3px solid var(--act);box-sizing:content-box}
.branchset{margin:6px 0 6px 6px;border-left:2px dashed var(--border-strong);padding-left:14px}
.branch{margin:7px 0;padding-left:12px;border-left:4px solid var(--bl);border-radius:2px}
.branch h4{margin:0 0 3px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.branch h4 em{font-style:normal;font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);
  font-variant-numeric:tabular-nums}
.branch .track{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sharebar{height:4px;border-radius:2px;background:var(--bl);margin:3px 0 5px}

/* ── 4. LANE GRID ──────────────────────────────────────────────────────── */
.gridwrap{overflow:auto;max-height:70vh}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
table.grid th,table.grid td{padding:3px 7px;text-align:center;white-space:nowrap}
table.grid thead th{position:sticky;top:0;background:var(--bg-deepest);z-index:2;
  font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-tertiary);
  border-bottom:1px solid var(--border-strong);padding-bottom:6px}
table.grid th.rowh{position:sticky;left:0;background:var(--bg-deepest);z-index:1;text-align:left;
  font-weight:500;max-width:230px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border-subtle)}
table.grid tbody tr:hover th.rowh,table.grid tbody tr:hover td{background:var(--bg-deep)}
.cell{display:inline-block;width:15px;height:15px;border-radius:4px;background:var(--bg-mid)}
.cell.on{background:var(--act)}
.cell.part{background:color-mix(in srgb,var(--act) 45%,var(--bg-mid))}
td.vol{text-align:right;font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);
  font-variant-numeric:tabular-nums}
.volbar{display:inline-block;height:7px;background:var(--act);border-radius:2px;vertical-align:0;opacity:.6}

/* ── 5. STEP ───────────────────────────────────────────────────────────── */
.stepwrap{max-width:900px}
.here{border:1px solid var(--act);background:var(--act-tint);border-radius:var(--r-s);padding:14px 16px;margin:0 0 14px}
.here h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.here p{margin:5px 0 0;color:var(--text-secondary);font-size:12.5px}
.nexts{display:grid;gap:8px}
.next{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;
  border:1px solid var(--border-subtle);border-radius:var(--r-i);background:var(--bg-deep);
  padding:9px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.next:hover{border-color:var(--act);background:var(--bg-mid)}
.next b{font-size:13.5px;font-weight:600}
.next .m{font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.next .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--bg-lighter);overflow:hidden}
.next .bar i{display:block;height:100%;background:var(--act);border-radius:3px}

/* ── 6. OUTLINE ────────────────────────────────────────────────────────── */
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:7px 0}
.joins{font-size:12px;color:var(--text-tertiary);padding:3px 0}
.joins b{color:var(--text-secondary);font-weight:500}
.choice{border-left:2px solid var(--border-strong);margin:9px 0 9px 2px;padding-left:11px}
.choice[data-d="0"]{border-left-color:var(--act)}
.choice[data-d="1"]{border-left-color:var(--accent-purple)}
.choice[data-d="2"]{border-left-color:var(--accent-green)}
.choice[data-d="3"]{border-left-color:var(--accent-amber)}
.choice-head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);margin:2px 0 6px}
.choice-head b{color:var(--text-secondary);font-weight:600}
details.alt{border:1px solid var(--border-subtle);border-radius:var(--r-i);background:var(--bg-deepest);margin:5px 0}
details.alt[open]{background:var(--bg-deep)}
details.alt>summary{cursor:pointer;list-style:none;padding:6px 10px;display:flex;align-items:center;
  gap:9px;flex-wrap:wrap;font-size:12.5px}
details.alt>summary::-webkit-details-marker{display:none}
details.alt>summary::before{content:"▸";color:var(--text-tertiary);font-size:10px;flex:none}
details.alt[open]>summary::before{content:"▾"}
.alt-body{padding:2px 10px 8px 22px}
.alt-n{font-family:var(--font-mono);font-size:10.5px;color:var(--text-tertiary);flex:none}
.cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-tertiary);
     white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;padding:1.5px 6px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.tag.some{background:color-mix(in srgb,var(--accent-amber) 18%,transparent);
          border-color:color-mix(in srgb,var(--accent-amber) 45%,transparent)}
.tag.all{background:var(--bg-mid);color:var(--text-tertiary)}
.tag.straight{background:var(--bg-mid);color:var(--text-tertiary);font-style:italic}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--bg-deepest);color:var(--text-primary);
  border:1px solid var(--border-strong);border-radius:var(--r-i);padding:6px 9px;font-size:12px;
  box-shadow:var(--shadow-float);max-width:280px;display:none}
.tip b{display:block;font-size:12.5px}
.tip span{color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}

@media (max-width:900px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div>
      <h1>Pathway Atlas</h1>
      <p class="sub" id="map-summary">no map loaded</p>
    </div>

    <div>
      <label class="field" for="map-pick">Map</label>
      <select id="map-pick">
        <option value="lanes">Demo — multi-word lanes</option>
        <option value="big">Demo — 296 boxes, 818 links</option>
        <option value="own">Your own CSV</option>
      </select>
    </div>

    <div id="own-wrap" hidden>
      <div class="row-btns" style="margin-bottom:7px">
        <button class="btn primary" id="pick-file">Choose CSV…</button>
        <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
      </div>
      <textarea id="csv-in" placeholder="…or paste the CSV here"></textarea>
      <div class="row-btns" style="margin-top:6px"><button class="btn" id="load-csv">Load pasted text</button></div>
      <p class="hint" id="csv-status" style="margin-top:6px">You can also drag a file anywhere onto this page.</p>
    </div>

    <div>
      <label class="field" for="start-q">Start from</label>
      <input type="text" id="start-q" placeholder="Type to filter boxes…" autocomplete="off">
      <div class="picker-list" id="start-list"></div>
    </div>

    <div>
      <label class="field" for="grouping">Group boxes</label>
      <select id="grouping">
        <option value="loose">As far as possible</option>
        <option value="strict">Only where behaviour matches</option>
      </select>

        <option value="0">Off — no name grouping</option>
