  showElement(id);
  zoomTo(frameOn(id), playTour);
}

function leaveTangle(quiet) {
  if (!FOCUS) return;
  stopTour();
  const svg = svgEl();
  if (svg) { const tr = svg.querySelector("g.n.focus .trace"); if (tr) tr.innerHTML = ""; }
  FOCUS = null; WHEEL_PICK = null;
  if (!quiet) SELECT = null;
  paintAtlas();
  if (!quiet) zoomTo(wholePicture());
}

// ---------------------------------------------------------------------------
// THE TOUR — every loop in the tangle, one after another, left on screen
// ---------------------------------------------------------------------------
// Entering a tangle plays its loops through: each draws itself round, then
// stays, faded, while the next one draws. What builds up is the answer to the
// question a list of loops cannot answer — how they sit on top of each other.
// ---------------------------------------------------------------------------
function stopTour() {
  cancelAnimationFrame(tourRAF);
  tourRAF = 0; tourAt = -1;
}

function tourLoops() {
  const w = WHEELS.get(FOCUS);
  if (!w) return [];
  return [...w.loops].sort((a, b) => b.gain - a.gain || a.cycle.length - b.cycle.length)
    .slice(0, TOUR_MAX);
}

function playTour() {
  if (!FOCUS) return;
  stopTour();
  const svg = svgEl();
  const g = svg && svg.querySelector("g.n.focus .trace");
  const w = WHEELS.get(FOCUS);
  if (!g || !w) return;
  const loops = tourLoops();
  if (!loops.length) { renderInspector(); return; }

  g.innerHTML = loops.map((l, i) => `<g class="tl" data-i="${i}">${
    l.links.map(e => {
      const [x1, y1] = w.at.get(e.from), [x2, y2] = w.at.get(e.to);
      const backwards = w.pos.get(e.to) <= w.pos.get(e.from);
      return `<path d="${chordPath(x1, y1, x2, y2, w.centre[0], w.centre[1], backwards ? 0.22 : 0.3)}"
        stroke="${l.reinforcing ? "var(--c1)" : "var(--c2)"}"></path>`;
    }).join("")}</g>`).join("");

  const groups = [...g.querySelectorAll("g.tl")];
  const lens = groups.map(gg => [...gg.querySelectorAll("path")].map(p =>
    typeof p.getTotalLength === "function" ? p.getTotalLength() : 0));
  groups.forEach((gg, i) => [...gg.querySelectorAll("path")].forEach((p, j) => {
    p.style.strokeDasharray = lens[i][j];
    p.style.strokeDashoffset = lens[i][j];
  }));

  if (reduced()) {
    groups.forEach(gg => {
      gg.classList.add("done");
      [...gg.querySelectorAll("path")].forEach(p => { p.style.strokeDashoffset = 0; });
    });
    tourAt = loops.length;
    renderInspector();
    return;
  }

  const DRAW = 620, HOLD = 260, PER = DRAW + HOLD;
  const t0 = performance.now();
  const tick = now => {
    const t = now - t0;
    const i = Math.min(loops.length - 1, Math.floor(t / PER));
    if (i !== tourAt) { tourAt = i; renderInspector(); }
    groups.forEach((gg, gi) => {
      const local = (t - gi * PER) / DRAW;
      const f = Math.max(0, Math.min(1, local));
      gg.classList.toggle("done", local >= 1);
      gg.classList.toggle("live", local >= 0 && local < 1);
      [...gg.querySelectorAll("path")].forEach((p, j) => {
        const per = 1 / lens[gi].length;
        const fj = Math.max(0, Math.min(1, (f - j * per) / per));
        p.style.strokeDashoffset = (lens[gi][j] * (1 - fj)).toFixed(2);
      });
    });
    if (t < loops.length * PER) { tourRAF = requestAnimationFrame(tick); return; }
    groups.forEach((gg, gi) => {
      gg.classList.remove("live"); gg.classList.add("done");
      [...gg.querySelectorAll("path")].forEach(p => { p.style.strokeDashoffset = 0; });
    });
    tourAt = loops.length; tourRAF = 0;
    renderInspector();
  };
  tourRAF = requestAnimationFrame(tick);
}

// ---------------------------------------------------------------------------
// THE INSPECTOR — one place for whatever is being looked at
// ---------------------------------------------------------------------------
function renderInspector() {
  const box = $("inspector");
  if (!box || !WORLD) return;
  const A = WORLD.A, M = WORLD.M, start = labelOf(A.start);
  const explain = `<p class="hint">Every <b>%</b> on this page is a share of the
    <b>readings</b> — the ${formatCount(A.shapes)} distinct pathways this page tells from
    <b>${esc(start)}</b>. “14% of everything” means fourteen readings in every hundred pass
    through it.</p>`;

  if (FOCUS) {
    const node = A.nodes.get(FOCUS), t = node.tangles[0];
    const w = WHEELS.get(FOCUS);
    const loops = w ? w.loops : [];
    const r = loops.filter(l => l.reinforcing).length;
    const shown = Math.min(TOUR_MAX, loops.length);
    const playing = tourRAF && tourAt >= 0 && tourAt < shown;
    const picked = WHEEL_PICK;
    const through = picked ? loopsThrough(picked) : [];
    const loop = through.length ? rotateTo(through[WHEEL_LOOP % through.length], picked) : null;
    box.innerHTML = `<div class="ins">
      <header><b>↻ Inside a tangle of ${t.boxes.length} ${plural(t.boxes.length, "box", "boxes")}</b>
        <span class="m">${w ? w.back.length : 0} ${plural(w ? w.back.length : 0, "link")} back ·
          ${r}R / ${loops.length - r}B · ${t.independent} independent</span></header>
      <p class="lede">Boxes sit round the rim in an order that makes almost every link run clockwise.
        The chords across the middle are the ones that run back — <b>they are the feedback</b>, and
        cutting them would leave a plain sequence.</p>
      <p class="cap">${playing
        ? `Playing the loops — <b>${tourAt + 1}</b> of ${shown}${
            loops.length > shown ? ` (the ${shown} strongest of ${loops.length})` : ""}.`
        : `<b>${shown}</b> ${plural(shown, "loop")} drawn${
            loops.length > shown ? ` — the strongest of ${loops.length}` : ""}. Point at a box on the
            rim to name it; click one to follow its own loop round.`}</p>
      ${picked ? loopCaption(picked, loop, through) : ""}
      <div class="row-btns" style="margin-top:9px">
        <button class="btn" type="button" data-replay>Replay the loops</button>
        <button class="btn" type="button" data-zoomout>← Back out to the whole map</button>
      </div>${explain}</div>`;
    return;
  }

  if (SELECT && A.nodes.has(SELECT)) {
    const node = A.nodes.get(SELECT);
    const names = set => [...set].filter(x => x !== END).map(labelOf);
    const ins = names(A.pred.get(SELECT) || new Set()), outs = names(A.succ.get(SELECT) || new Set());
    const list = l => l.length
      ? l.slice(0, 6).map(n => `<em>${esc(clip(n, 30))}</em>`).join("") +
        (l.length > 6 ? `<i>+${l.length - 6} more</i>` : "")
      : `<i>nothing</i>`;
    const lanes = [...(node.lanes || [])].sort();
    box.innerHTML = `<div class="ins">
      <header><b>${esc(node.label)}</b>
        <span class="m">${pct(M.weight(SELECT))} of everything${
          node.boxes.length > 1 ? ` · ${node.boxes.length} boxes` : ""}</span></header>
      <p class="cap"><b>${pct(M.weight(SELECT))}</b> of the readings from <b>${esc(start)}</b> pass
        through here${node.boxes.length > 1
          ? `, and this one circle stands for ${node.boxes.length} boxes that behave alike — the rail
             lists them` : ""}.</p>
      <div class="wires"><span class="k">reached from</span><div class="chain">${list(ins)}</div></div>
      <div class="wires"><span class="k">leads to</span><div class="chain">${list(outs)}</div></div>
      ${lanes.length ? `<p class="hint" style="margin-top:7px">Lanes: ${esc(lanes.slice(0, 8).join(", "))}${
        lanes.length > 8 ? ` +${lanes.length - 8}` : ""}</p>` : ""}
      ${explain}</div>`;
    return;
  }

  box.innerHTML = `<div class="ins">
    <header><b>Everything downstream of ${esc(start)}</b>
      <span class="m">${A.elements} elements · ${formatCount(A.shapes)} readings</span></header>
    <p class="lede">Point at any circle to name it. Click one to light up what it reaches and what
      reaches it. Click an amber <b>↻</b> to go inside a knot of feedback and watch its loops.</p>
    ${explain}</div>`;
}

function loopCaption(picked, loop, through) {
  if (!loop) return `<p class="cap"><b>${esc(boxLabel(picked))}</b> — no loop found through it.</p>`;
  return `<p class="cap"><b>${esc(boxLabel(picked))}</b> comes back to itself
      ${through.length} ${plural(through.length, "way")}${through.length > 1
        ? ` — showing ${WHEEL_LOOP % through.length === 0 ? "the shortest"
            : (WHEEL_LOOP % through.length) + 1 + " of " + through.length}` : ""}.</p>
    <p class="chain">${loop.cycle.slice(0, CHAIN_MAX).map((b, i) =>
      `<em class="${b === picked ? "head" : ""}">${esc(clip(boxLabel(b), 24))}</em>` +
      `<i>${loop.links[i].elasticity < 0 ? "−" : "+"}→</i>`).join("")}${
      loop.cycle.length > CHAIN_MAX ? `<i>${loop.cycle.length - CHAIN_MAX} more →</i>` : ""}
      <em class="head">${esc(clip(boxLabel(picked), 24))}</em></p>
    <p class="m">${loop.reinforcing ? "Reinforcing" : "Balancing"} ·
      ${loop.cycle.length} ${plural(loop.cycle.length, "box", "boxes")} ·
      gain ${loop.gain < 0.0005 ? "≈0" : loop.gain.toFixed(3)}</p>
    ${through.length > 1
      ? `<div class="row-btns" style="margin-top:7px">
           <button class="btn" type="button" data-wheelnext>Next loop through it</button></div>` : ""}`;
}

// ---------------------------------------------------------------------------
// INSIDE THE TANGLE — one box, and how it comes back to itself
// ---------------------------------------------------------------------------
// The tour shows every loop. This shows one: click a box on the rim and its own
// loop draws itself round, starting and ending where you clicked, because a
// loop has no beginning but an explanation does.
// ---------------------------------------------------------------------------
function paintWheel() {
  const svg = svgEl();
  if (!svg) return;
  const g = FOCUS && svg.querySelector("g.n.focus");
  if (!g) return;
  const w = WHEELS.get(FOCUS);
  if (!w) return;
  const picked = WHEEL_PICK && w.pos.has(WHEEL_PICK) ? WHEEL_PICK : null;
  g.classList.toggle("picked", !!picked);

  const through = picked ? loopsThrough(picked) : [];
  const loop = through.length ? rotateTo(through[WHEEL_LOOP % through.length], picked) : null;
  const onCycle = new Set(loop ? loop.cycle : picked ? [picked] : []);
  const key = e => e.from + "" + e.to;
  const onLink = new Set((loop ? loop.links : []).map(key));
  if (picked) for (const e of w.touching.get(picked) || []) onLink.add(key(e));

  for (const el of g.querySelectorAll(".ch")) el.classList.toggle("on", onLink.has(el.dataset.k));
  for (const el of g.querySelectorAll(".nd")) {
    const mine = el.dataset.box === picked;
    el.classList.toggle("on", onCycle.has(el.dataset.box));
    el.classList.toggle("sel", mine);
  }
  g.querySelector(".labs").innerHTML = picked ? wheelLabels(picked, [...onCycle]) : "";

  const trace = g.querySelector(".trace");
  if (picked) {
    trace.innerHTML = `<g class="tl live">${(loop ? loop.links : []).map(e => {
      const [x1, y1] = w.at.get(e.from), [x2, y2] = w.at.get(e.to);
      const backwards = w.pos.get(e.to) <= w.pos.get(e.from);
      return `<path d="${chordPath(x1, y1, x2, y2, w.centre[0], w.centre[1], backwards ? 0.22 : 0.3)}"
        stroke="${loop && loop.reinforcing ? "var(--c1)" : "var(--c2)"}"></path>`;
    }).join("")}</g>`;
    runTrace(trace);
  } else if (!tourRAF && tourAt < 0) {
    trace.innerHTML = "";
  }
}

// Names on adjacent rim positions overprint, so they are spaced — and the box
// being explained is always one of them.
function wheelLabels(picked, cycle) {
  const w = WHEELS.get(FOCUS);
  if (!w || !w.at) return "";
  const n = w.order.length, apart = Math.max(2, Math.round(n / 30));
  const out = [picked];
  for (const b of cycle) {
    if (out.length >= 9) break;
    if (out.some(o => Math.abs(w.pos.get(o) - w.pos.get(b)) < apart)) continue;
    out.push(b);
  }
  return out.map(b => {
    const p = w.at.get(b);
    if (!p) return "";
    const a = p[2], lx = w.centre[0] + (w.radius + 6) * Math.cos(a),
          ly = w.centre[1] + (w.radius + 6) * Math.sin(a);
    const left = Math.cos(a) < -0.08;
    return `<text class="bl" x="${lx.toFixed(1)}" y="${(ly + 3).toFixed(1)}"
      text-anchor="${left ? "end" : Math.cos(a) > 0.08 ? "start" : "middle"}"
      >${esc(clip(boxLabel(b), 24))}</text>`;
  }).join("");
}

function loopsThrough(box) {
  const w = WHEELS.get(FOCUS);
  if (!w) return [];
  const all = [], seen = new Set();
  // Two sets of loops, both worth having: the one each back link closes, which
  // is what the chords ARE, and the shortest loop through each box, which is
  // what a reader asking "how does this come round" actually wants.
  for (const l of [...(WHEEL_TANGLE ? WHEEL_TANGLE.loops : []), ...w.loops]) {
    const k = canonicalCycle(l.cycle);
    if (seen.has(k) || !l.cycle.includes(box)) continue;
    seen.add(k);
    all.push(l);
  }
  return all.sort((a, b) => a.cycle.length - b.cycle.length || b.gain - a.gain);
}

// A loop has no beginning, but an explanation does: the reader asked about THIS
// box, so the story starts and ends there.
function rotateTo(loop, box) {
  const i = loop.cycle.indexOf(box);
  if (i <= 0) return loop;
  return { ...loop,
    cycle: loop.cycle.slice(i).concat(loop.cycle.slice(0, i)),
    links: loop.links.slice(i).concat(loop.links.slice(0, i)) };
}

// The loop draws itself, link by link, and starts again. Watching the line come
// back round is the part a still picture cannot do — so if the reader has asked
// for less motion, the whole loop is simply drawn at once instead.
function runTrace(g) {
  cancelAnimationFrame(traceRAF);
  const paths = [...g.querySelectorAll("path")];
  if (!paths.length || typeof paths[0].getTotalLength !== "function") return;
  const lens = paths.map(p => p.getTotalLength());
  paths.forEach((p, i) => { p.style.strokeDasharray = lens[i]; });
  if (reduced()) {
    paths.forEach(p => { p.style.strokeDashoffset = 0; });
    return;
  }
  const STEP = 340, HOLD = 900, total = paths.length * STEP + HOLD;
  const t0 = performance.now();
  const tick = now => {
    const t = (now - t0) % total;
    paths.forEach((p, i) => {
      const f = Math.max(0, Math.min(1, (t - i * STEP) / STEP));
      p.style.strokeDashoffset = (lens[i] * (1 - f)).toFixed(2);
    });
    traceRAF = requestAnimationFrame(tick);
  };
  traceRAF = requestAnimationFrame(tick);
}

function pickWheelBox(box) {
  stopTour();
  WHEEL_PICK = box && box !== WHEEL_PICK ? box : null;
  WHEEL_LOOP = 0;
  paintAtlas();
}

// ---------------------------------------------------------------------------
// 2. LOOPS — the ring diagram
// ---------------------------------------------------------------------------
// The canonical causal-loop picture, one card per loop: the boxes set round a
// circle, arrows following it, a + or − on every link, and R or B in the middle.
// A tangle stops being a wall of names and becomes a grid of small rings.
//
// Past eight boxes a ring stops being readable — the labels collide and the
// polygon stops looking like a circle — so a long loop is laid out flat
// instead, with the closing link drawn as a return. Forcing it into a circle
// anyway would be prettier and less legible.
// ---------------------------------------------------------------------------
const RING_MAX = 8;
const boxLabel = id => (G.byId.get(id) || {}).label || id;

function loopSign(link) { return link.elasticity < 0 ? "−" : "+"; }

let ringSeq = 0;

// When every box in a loop sits in the same lane, the card says so once and the
// ring drops it. "Cat A Treatment Referral" clipped to "Cat A Treatmen…" tells
// you nothing; "Treatment Referral" tells you everything.
function ringLabels(loop) {
  const lanes = new Set();
  for (const b of loop.cycle) { const l = ATLAS.lanes.laneOf.get(b); if (l) lanes.add(l); }
  const only = lanes.size === 1 ? [...lanes][0] : null;
  return loop.cycle.map(b => {
    const full = boxLabel(b);
    if (!only) return full;
    const trimmed = full.replace(new RegExp("\\b" + only.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i"), "").replace(/\s+/g, " ").trim();
    return trimmed || full;
  });
}

function ringSvg(loop) {
  // Each ring needs its own arrowhead id. Sharing one across cards makes them
  // collide, and the arrows — the entire point of a causal loop diagram —
  // silently vanish.
  const ar = "ar" + (ringSeq++);
  const n = loop.cycle.length;
  if (n > RING_MAX) return flatLoop(loop);
  const names = ringLabels(loop);
  const W = 290, H = n <= 2 ? 138 : n <= 5 ? 168 : 208, cx = W / 2, cy = H / 2,
        R = n <= 2 ? 28 : n <= 5 ? 40 : 50;
  const pt = i => {
    const a = (-Math.PI / 2) + (i * 2 * Math.PI) / n;
    return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
  };
  // Links stop short of the boxes at both ends. Run them all the way and the
  // box circle — drawn afterwards, on top — hides the arrowhead, which is the
  // one mark on a causal loop diagram that cannot be left out.
  const trim = (ax, ay, bx, by, head, tail) => {
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
    return [ax + (dx / len) * tail, ay + (dy / len) * tail,
            bx - (dx / len) * head, by - (dy / len) * head];
  };
  const parts = [];
  for (let i = 0; i < n; i++) {
    const [rx1, ry1] = pt(i), [rx2, ry2] = pt((i + 1) % n);
    const [x1, y1, x2, y2] = trim(rx1, ry1, rx2, ry2, 12, 7);
    if (n === 1) {                                  // a box feeding itself
      parts.push(`<circle class="lk" cx="${cx}" cy="${cy - 20}" r="18" fill="none"></circle>`);
      break;
    }
    if (n === 2) {                                  // two boxes, bowed apart
      const bow = i === 0 ? 26 : -26;
      const mx = (rx1 + rx2) / 2 + bow, my = (ry1 + ry2) / 2;
      parts.push(`<path class="lk" d="M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}" marker-end="url(#${ar})"></path>`);
      parts.push(`<text class="sg" x="${mx + (i === 0 ? 10 : -10)}" y="${my + 4}">${loopSign(loop.links[i])}</text>`);
      continue;
    }
    parts.push(`<line class="lk" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${ar})"></line>`);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    parts.push(`<text class="sg" x="${mx + (mx - cx) * 0.34}" y="${my + (my - cy) * 0.34 + 4}">${loopSign(loop.links[i])}</text>`);
  }
  for (let i = 0; i < n; i++) {
    const [x, y] = pt(i);
    const outward = n === 1 ? 0 : (x - cx) / R;
    const anchor = Math.abs(outward) < 0.35 ? "middle" : outward > 0 ? "start" : "end";
    const lx = x + outward * 12, ly = y + ((y - cy) / R) * 12 + (Math.abs(outward) < 0.35 ? (y < cy ? -10 : 16) : 4);
    parts.push(`<circle class="bx" cx="${x}" cy="${y}" r="5"></circle>`);
    parts.push(`<text class="bl" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(clip(names[i], 20))}</text>`);
  }
  parts.push(`<text class="rb ${loop.reinforcing ? "r" : "b"}" x="${cx}" y="${cy + 8}" text-anchor="middle">${loop.reinforcing ? "R" : "B"}</text>`);
  return `<svg class="ring" viewBox="0 0 ${W} ${H}" width="100%" role="img"
    aria-label="${loop.reinforcing ? "Reinforcing" : "Balancing"} loop: ${esc(loop.cycle.map(boxLabel).join(" then "))}, back to the start">
    <defs><marker id="${ar}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" class="ah"></path></marker></defs>${parts.join("")}</svg>`;
}

function flatLoop(loop) {
  const chain = loop.cycle.map((id, i) =>
    `<span class="el">${esc(clip(boxLabel(id), 22))}</span>` +
    `<span class="arrow">${loopSign(loop.links[i])}→</span>`).join("");
  return `<div class="flatloop">${chain}<span class="back">↩ back to ${esc(clip(boxLabel(loop.cycle[0]), 22))}</span></div>`;
}

function loopCard(loop, A) {
  const own = new Set();
  for (const b of loop.cycle) { const l = A.lanes.laneOf.get(b); if (l) own.add(l); }
  const lanes = [...own].sort();
  return `<article class="loopcard ${loop.reinforcing ? "r" : "b"}" data-loopel="${esc(loop.element)}">
    <header>
      <span class="pol ${loop.reinforcing ? "r" : "b"}">${loop.reinforcing ? "Reinforcing" : "Balancing"}</span>
      <span class="m">gain ${loop.gain < 0.0005 ? "≈0" : loop.gain.toFixed(3)}</span>
      <span class="m">${loop.cycle.length} ${plural(loop.cycle.length, "box", "boxes")}</span>
      ${loop.copies > 1 ? `<span class="m">in ${loop.copies} places</span>` : ""}
    </header>
    ${ringSvg(loop)}
    <p class="hint">${loop.reinforcing
      ? "A nudge here comes back amplified — it runs away or collapses unless something else holds it."
      : "A nudge here comes back opposed — it settles, and resists being pushed."}</p>
    ${lanes.length ? `<p class="hint">${lanes.length === 1 ? "In the " + esc(lanes[0]) + " lane"
        : "Across " + esc(lanes.slice(0, 4).join(", ")) + (lanes.length > 4 ? " and " + (lanes.length - 4) + " more" : "")}${
        loop.copies > 1 ? `, and the same shape runs in ${loop.copies} places` : ""}.</p>` : ""}
  </article>`;
}

// The Loops tab and the Flow drawer sort by the same rule, so the order does
// not change under you when you move between them.
function sortLoops(list) {
  if (LOOP_SORT === "length")
    return [...list].sort((a, b) => a.cycle.length - b.cycle.length || b.gain - a.gain);
  if (LOOP_SORT === "polarity")
    return [...list].sort((a, b) => Number(b.reinforcing) - Number(a.reinforcing) || b.gain - a.gain);
  return [...list].sort((a, b) => b.gain - a.gain || a.cycle.length - b.cycle.length);
}

function loopSortButtons() {
  return ["gain", "length", "polarity"].map(k =>
    `<button class="btn" type="button" data-loopsort="${k}"${LOOP_SORT === k
      ? ' style="background:var(--act);border-color:var(--act);color:#fff"' : ""}>${
      k === "gain" ? "Strongest first" : k === "length" ? "Shortest first" : "Group by polarity"}</button>`).join("");
}

function viewLoops(A, M) {
  const all = A.feedback || [];
  if (!all.length)
    return `<p class="lede">This map has no feedback at all downstream of
      <b>${esc(boxLabel(A.startId))}</b> — every pathway runs one way and stops.</p>`;

  const r = all.filter(l => l.reinforcing).length;
  const tangles = A.loops.length;
  const biggest = Math.max(...A.loops.map(n => n.tangles[0] ? n.tangles[0].boxes.length : 0));
  const independent = A.loops.reduce((a, n) => a + (n.tangles[0] ? n.tangles[0].independent : 0), 0);
  const sorted = sortLoops(all);

  return `<div class="legend">
      <span><i style="background:var(--c1)"></i><b>R</b> reinforcing — a nudge comes back amplified</span>
      <span><i style="background:var(--c2)"></i><b>B</b> balancing — a nudge comes back opposed</span>
      <span>gain is the elasticities multiplied round the ring</span>
    </div>
    <p class="lede" style="margin-bottom:10px">${all.length === 1
      ? `One loop, of <b>${biggest}</b> ${plural(biggest, "box", "boxes")}. It is ${r ? "reinforcing" : "balancing"}.`
      : `<b>${tangles}</b> ${plural(tangles, "tangle")} of feedback, the largest holding <b>${biggest}</b> boxes.
         It would take <b>${independent}</b> ${plural(independent, "loop")} to generate every loop in there; below is
         the shortest loop through each box — <b>${all.length}</b> of them — so no box is left without a story.
         <b>${r}</b> reinforcing, <b>${all.length - r}</b> balancing.`}</p>
    <div class="row-btns" style="margin-bottom:14px">${loopSortButtons()}</div>
    <div class="loopgrid">${sorted.slice(0, 60).map(l => loopCard(l, A)).join("")}</div>
    ${sorted.length > 60 ? `<p class="hint" style="margin-top:12px">Showing the first 60 of ${sorted.length}.</p>` : ""}`;
}

// ---------------------------------------------------------------------------
// SHELL
// ---------------------------------------------------------------------------
const VIEW_NOTES = {
  atlas: "Every element is a circle whose <b>area</b> is the share of readings running through it, and left to right is how far along you are. Point at anything to name it, click it to light up what it touches, and click an amber <b>↻</b> to go inside a knot of feedback.",
  loops: "Every feedback loop, one ring each, with its polarity and its gain. A tangle of many loops sharing boxes becomes a grid of small readable rings rather than one opaque blob.",
};
const VIEWS = { atlas: viewAtlas, loops: viewLoops };

function renderStats() {
  const A = ATLAS;
  if (!A) { $("stats").innerHTML = ""; $("warn").innerHTML = ""; return; }
  const cells = [
    ["Boxes reached", A.boxesInScope.toLocaleString("en-GB"), ""],
    ["Pathways", formatCount(A.pathways), ""],
    ["Readings", formatCount(A.shapes), A.shapes < A.pathways ? "good" : ""],
    ["Elements", String(A.elements), A.elements < A.elementsUngrouped ? "good" : ""],
    ["Feedback", A.loops.length
      ? `${A.loops.length} ${plural(A.loops.length, "tangle")} · ${(A.feedback || []).length} ${plural((A.feedback || []).length, "loop")}`
      : "none", ""],
    ["Built in", A.ms < 1000 ? A.ms + "ms" : (A.ms / 1000).toFixed(1) + "s", "good"],
  ];
  $("stats").innerHTML = cells.map(([k, v, tone]) =>
    `<div><span class="k">${esc(k)}</span><span class="v ${tone}">${esc(v)}</span></div>`).join("");
  $("warn").innerHTML = A.shapes > A.pathways
    ? `<div class="note"><b>${formatCount(A.shapes)} readings stand for ${formatCount(A.pathways)} real pathways.</b>
       Groups are held together as far as they can go, so some members of a group go on to differ —
       ${A.partialSteps} of ${A.totalSteps} steps are taken by only part of their group. Every real
       pathway is still in here; open an element to see exactly which boxes it stands for.</div>`
    : "";
}

// Nothing is loaded until you load it: there is no demo map to be mistaken for
// your own data, and nothing is sent anywhere when you do.
function showEmpty() {
  $("stats").innerHTML = ""; $("warn").innerHTML = ""; $("viewnote").innerHTML = "";
  $("lane-box").innerHTML = ""; $("detail-box").hidden = true;
  $("start-list").innerHTML = ""; $("start-wrap").hidden = true; $("views").hidden = true;
  $("stage").innerHTML = `<div class="empty">
    <h2>Load a map to begin</h2>
    <p class="lede">Use <b>Choose CSV…</b> in the rail — the file the app's CSV button saves — or drag
      it anywhere onto this page. Everything runs here in the browser; nothing is uploaded.</p>
    <p class="hint" style="margin-top:10px">Then pick the box you want to look downstream of. Every
      pathway from it is in the picture, however far it meanders.</p></div>`;
}

function renderView() {
  const stage = $("stage");
  if (!ATLAS) { showEmpty(); return; }
  if (!ATLAS.elements) {
    stage.innerHTML = `<p class="lede">Nothing leads away from
      <b>${esc((G.byId.get(ATLAS.startId) || {}).label || ATLAS.startId)}</b> following the arrows.</p>`;
    return;
  }
  cancelAnimationFrame(traceRAF);
  $("views").hidden = false;
  $("viewnote").innerHTML = VIEW_NOTES[VIEW];
  for (const b of $("views").children) b.setAttribute("aria-selected", String(b.dataset.v === VIEW));
  const M = measure(ATLAS);
  stage.innerHTML = VIEWS[VIEW](ATLAS, M);
  stage.scrollTop = 0;
  if (VIEW !== "atlas" || !WORLD) return;
  VB = FOCUS && WORLD.at.has(FOCUS) ? frameOn(FOCUS) : wholePicture();
  setScale();
  paintAtlas();
  revealAtlas();
  if (FOCUS) playTour();
}

// The picture draws itself in, column by column, so the first thing a reader
// sees is the shape arriving rather than a wall of circles already there.
function revealAtlas() {
  const svg = svgEl();
  if (!svg || reduced()) return;
  const groups = [...svg.querySelectorAll("g.n")];
  groups.forEach(g => {
    const [x] = WORLD.at.get(g.dataset.el) || [0];
    g.style.animationDelay = Math.min(700, (x / WORLD.W) * 620).toFixed(0) + "ms";
  });
  svg.classList.add("reveal");
  setTimeout(() => svg.classList.remove("reveal"), REVEAL + 800);
}

// Every family opens to show its members, and the list of lane values opens
// too. A grouping you cannot check is a grouping you have to take on trust.
function railLanes() {
  const box = $("lane-box");
  if (!ATLAS) { box.innerHTML = ""; return; }
  const L = ATLAS.lanes;
  if (!L.families.length) {
    box.innerHTML = `<h3>Name grouping</h3><p class="hint">No families found — this map does not
      repeat itself along a named dimension that the rules recognise.</p>`;
    return;
  }
  const values = [...L.laneValues].sort();
  const fams = [...L.families].sort((a, b) => b.members.length - a.members.length);
  const SHOWN = 10;
  const famHtml = f => `<details class="famd">
    <summary><b>${esc(familyLabel(f.key))}</b><span>×${f.members.length}</span></summary>
    <ul class="members">${[...f.members]
      .sort((a, b) => (a.token < b.token ? -1 : 1))
      .map(m => `<li>${esc((G.byId.get(m.id) || {}).label || m.id)} <em>${esc(m.token)}</em></li>`)
      .join("")}</ul></details>`;
  box.innerHTML = `<h3>Name grouping</h3>
    <details class="famd" style="border-top:0">
      <summary><b>${values.length} ${plural(values.length, "lane")}</b><span>open</span></summary>
      <ul class="members">${values.map(v => `<li>${esc(v)}</li>`).join("")}</ul></details>
    <p class="hint" style="margin:5px 0 7px">${fams.length} ${plural(fams.length, "family", "families")},
      standing for ${L.foldedBoxes} ${plural(L.foldedBoxes, "box", "boxes")}. Open one to see what is in it.</p>` +
    fams.slice(0, SHOWN).map(famHtml).join("") +
    (fams.length > SHOWN
      ? `<details class="more"><summary>Show the other ${fams.length - SHOWN}</summary>
         ${fams.slice(SHOWN).map(famHtml).join("")}</details>`
      : "");
}

function showElement(id) {
  const node = ATLAS && ATLAS.nodes.get(id);
  const box = $("detail-box");
  if (!node) { box.hidden = true; return; }
  box.hidden = false;
  const boxes = node.boxes.map(b => (G.byId.get(b) || {}).label || b).sort();
  const t = node.loop && node.tangles.length ? node.tangles[0] : null;
  const SHOWN = 12;
  const li = b => `<li>${esc(b)}</li>`;
  box.innerHTML = `<h3>${esc(node.label)}</h3>
    <p class="hint" style="margin-bottom:6px">${boxes.length} ${plural(boxes.length, "box", "boxes")}${
      node.loop ? " in a feedback tangle" : node.copies > 1 ? `, grouped from ${node.copies} places` : ""}</p>` +
    (t ? `<p class="hint" style="margin-bottom:6px"><b>${t.reinforcing}</b> reinforcing,
       <b>${t.balancing}</b> balancing · ${t.independent} independent ·
       ${t.waysIn.length} ${plural(t.waysIn.length, "way")} in, ${t.waysOut.length} out</p>` : "") +
    `<ul class="members" style="margin-left:0;border-left:0;padding-left:0">${
      boxes.slice(0, SHOWN).map(li).join("")}</ul>` +
    (boxes.length > SHOWN
      ? `<details class="more"><summary>Show all ${boxes.length}</summary>
         <ul class="members" style="margin-left:0;border-left:0;padding-left:0">${
           boxes.map(li).join("")}</ul></details>`
      : "");
}

function fillPicker() {
  const q = QUERY.trim().toLowerCase();
  const matches = G.nodes.filter(n => !q || (n.label || n.id).toLowerCase().includes(q));
  const groups = new Map();
  for (const n of matches.slice(0, 400)) {
    const g = n.stream || "Boxes";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(n);
  }
  $("start-list").innerHTML = [...groups].map(([g, list]) =>
    `<div class="grp">${esc(g)}</div>` + list.map(n =>
      `<button type="button" data-id="${esc(n.id)}" aria-selected="${n.id === START}">${esc(n.label || n.id)}</button>`
    ).join("")).join("") || `<div class="grp">nothing matches “${esc(QUERY)}”</div>`;
}

// The settings that used to sit in the rail are settled, and settled here so
// there is one answer per map rather than one per combination of switches:
//
//   grouping        as far as possible — held together up to the point where
//                   holding them together would invent feedback the map does
//                   not contain, which is the most condensation available
//                   without inventing anything
//   minMembers 3    two boxes that happen to rhyme are a coincidence; three
//                   sharing a prefix and suffix are a pattern
//   minTokenFamilies 2  a lane value has to play its part in more than one
//                   role, so a single coincidental pair cannot mint a lane
const SETTINGS = { grouping: "loose", lanes: { minMembers: 3, minTokenFamilies: 2 } };

function run() {
  if (!G || !START) return;
  $("stage").innerHTML = '<p class="busy">Building…</p>';
  requestAnimationFrame(() => {
    try {
      ATLAS = buildAtlas(G, START, SETTINGS);
    } catch (err) {
      $("stage").innerHTML = `<p class="lede">That did not work: ${esc(err.message)}</p>`;
      return;
    }
    FOCUS = null; SELECT = null; VB = null; WHEEL_PICK = null; WHEEL_LOOP = 0;
    WHEELS.clear(); stopTour();
    railLanes(); renderStats(); renderView();
  });
}

function loadMap(map) {
  G = buildGraph(map);
  ATLAS = null;
  $("map-summary").textContent = `${map.nodes.length} boxes · ${map.edges.length} links · ${map.name}`;
  let best = null;
  for (const n of G.nodes) {
    const size = reachableFrom(G, n.id).size;
    if (!best || size > best.size) best = { id: n.id, size };
  }
  START = best ? best.id : (G.nodes[0] || {}).id;
  QUERY = ""; $("start-q").value = "";
  $("start-wrap").hidden = false;
  fillPicker();
  $("detail-box").hidden = true;
  run();
}

function ingestCsv(text, source) {
  const status = $("csv-status");
  try {
    const map = parseAriadneCsv(text);
    if (!map.nodes.length) {
      status.textContent = "No boxes in that file. It needs to be the CSV the app's CSV button saves — the one with SECTION: nodes in it.";
      return;
    }
    status.textContent = `Loaded ${map.nodes.length} boxes and ${map.edges.length} links` +
      (source ? ` from ${source}` : "") + ".";
    loadMap(map);
  } catch (err) {
    status.textContent = "Could not read that file: " + err.message;
  }
}

function readFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => ingestCsv(String(r.result), file.name);
  r.onerror = () => { $("csv-status").textContent = "Could not read that file."; };
  r.readAsText(file);
}

// ── wiring ────────────────────────────────────────────────────────────────
$("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  VIEW = b.dataset.v;
  renderView();
});

// ── the picture answers the pointer ───────────────────────────────────────
let panFrom = null, panMoved = 0;

function atlasPointerDown(e) {
  const svg = svgEl();
  if (!svg || !VB || VB.w >= WORLD.W - 1) return;
  // No pointer capture yet. Capturing here would make the click land on the
  // whole picture instead of the circle under the pointer, which quietly broke
  // every click inside a tangle.
  panFrom = { x: e.clientX, y: e.clientY, vb: { ...VB }, id: e.pointerId };
  panMoved = 0;
}

function atlasPointerMove(e) {
  if (!panFrom) return;
  const svg = svgEl();
  const box = svg.getBoundingClientRect();
  const z = Math.min(box.width / VB.w, box.height / VB.h) || 1;
  const dx = e.clientX - panFrom.x, dy = e.clientY - panFrom.y;
  panMoved = Math.max(panMoved, Math.hypot(dx, dy));
  if (panMoved > 4 && !panFrom.held) {          // it is a drag after all
    panFrom.held = true;
    svg.classList.add("panning");
    try { svg.setPointerCapture(panFrom.id); } catch (err) { /* not a real pointer */ }
  }
  if (!panFrom.held) return;
  VB = { ...panFrom.vb, x: panFrom.vb.x - dx / z, y: panFrom.vb.y - dy / z };
  setScale();
}

function atlasPointerUp(e) {
  const svg = svgEl();
  if (svg) svg.classList.remove("panning");
  if (panFrom && panFrom.held && svg)
    try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* already gone */ }
  panFrom = null;
}

$("stage").addEventListener("pointerdown", e => {
  if (e.target.closest("svg.atlas")) atlasPointerDown(e);
});
$("stage").addEventListener("pointermove", atlasPointerMove);
$("stage").addEventListener("pointerup", atlasPointerUp);
$("stage").addEventListener("pointercancel", atlasPointerUp);

$("stage").addEventListener("click", e => {
  // A drag that ends on a circle is not a click on it.
  if (panMoved > 4) { panMoved = 0; return; }
  const ls = e.target.closest("[data-loopsort]");
  if (ls) { LOOP_SORT = ls.dataset.loopsort; renderView(); return; }
  if (e.target.closest("[data-zoomout]")) {
    if (FOCUS) leaveTangle();
    else zoomTo(wholePicture(), () => paintAtlas());
    return;
  }
  if (e.target.closest("[data-replay]")) { WHEEL_PICK = null; paintAtlas(); playTour(); return; }
  if (e.target.closest("[data-wheelnext]")) { WHEEL_LOOP++; paintAtlas(); return; }

  const nd = e.target.closest("g.n.focus .nd");
  if (nd) { pickWheelBox(nd.dataset.box); return; }

  const g = e.target.closest("svg.atlas g.n");
  if (g) {
    if (g.dataset.loop) enterTangle(g.dataset.el);
    else selectEl(g.dataset.el);
    return;
  }
  const el = e.target.closest("[data-el]");
  if (el) showElement(el.dataset.el);
});

$("stage").addEventListener("dblclick", e => {
  const g = e.target.closest("svg.atlas g.n");
  if (!g || !WORLD || !WORLD.at.has(g.dataset.el)) return;
  if (g.dataset.loop) { enterTangle(g.dataset.el); return; }
  SELECT = g.dataset.el;
  paintAtlas();
  zoomTo(frameOn(g.dataset.el), () => paintAtlas());
});

$("stage").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target.closest && e.target.closest("svg.atlas g.n");
  if (!g) return;
  e.preventDefault();
  if (g.dataset.loop) enterTangle(g.dataset.el); else selectEl(g.dataset.el);
});

addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (WHEEL_PICK) { pickWheelBox(null); return; }
  if (FOCUS) { leaveTangle(); return; }
  if (VB && WORLD && VB.w < WORLD.W - 1) { zoomTo(wholePicture(), () => paintAtlas()); return; }
  if (SELECT) { SELECT = null; paintAtlas(); $("detail-box").hidden = true; }
});

addEventListener("resize", () => setScale());

$("stage").addEventListener("mouseover", e => {
  const tip = $("tip");
  const nd = e.target.closest("g.n.focus .nd");
  if (nd) {
    const w = WHEELS.get(FOCUS);
    const n = w ? w.share.get(nd.dataset.box) : 0;
    tip.innerHTML = `<b>${esc(boxLabel(nd.dataset.box))}</b><span>in ${n} ${
      plural(n, "loop")} of this tangle · click to follow one</span>`;
    tip.style.display = "block";
    return;
  }
  const g = e.target.closest("svg.atlas g.n");
  if (!g || !ATLAS || !ATLAS.nodes.has(g.dataset.el)) { tip.style.display = "none"; return; }
  const node = ATLAS.nodes.get(g.dataset.el);
  const M = measure(ATLAS);
  tip.innerHTML = `<b>${esc(node.label)}</b><span>${pct(M.weight(g.dataset.el))} of all readings pass
    through · ${node.boxes.length} ${plural(node.boxes.length, "box", "boxes")}${
    node.loop ? " · click to go inside" : ""}</span>`;
  tip.style.display = "block";
});
$("stage").addEventListener("mousemove", e => {
  const tip = $("tip");
  if (tip.style.display !== "block") return;
  tip.style.left = Math.min(innerWidth - 300, e.clientX + 14) + "px";
  tip.style.top = Math.max(8, e.clientY - 46) + "px";
});
$("stage").addEventListener("mouseleave", () => { $("tip").style.display = "none"; });

$("pick-file").addEventListener("click", () => $("csv-file").click());
$("csv-file").addEventListener("change", e => readFile(e.target.files[0]));
$("load-csv").addEventListener("click", () => ingestCsv($("csv-in").value, "the pasted text"));

let dragDepth = 0;
addEventListener("dragover", e => e.preventDefault());
addEventListener("dragenter", e => { e.preventDefault(); if (++dragDepth === 1) document.body.classList.add("dropping"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dropping"); } });
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dropping");
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) readFile(f);
});

$("start-q").addEventListener("input", e => { QUERY = e.target.value; fillPicker(); });
$("start-list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-id]");
  if (!btn) return;
  START = btn.dataset.id;
  fillPicker();
  run();
});
$("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const now = root.getAttribute("data-theme");
  const sysDark = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", (now ? now === "dark" : sysDark) ? "light" : "dark");
});
showEmpty();
</script>
</body>
