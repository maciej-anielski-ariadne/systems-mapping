<!DOCTYPE html>
<!--
================================================================================
 Ariadne Maps — single-page web app

 This is the only file you need to open in a browser. Everything else is loaded
 from the `assets/` folder next to it. The app is fully self-contained:
 fonts are bundled locally, no internet connection is needed.

 ─── Where to find what ────────────────────────────────────────────────────
   assets/fonts/     Web fonts (Fraunces, IBM Plex Sans, IBM Plex Mono).
   assets/css/       Stylesheets. Files are numbered in the order they load —
                     start with 01-variables.css to change colours or fonts.
   assets/js/        JavaScript. Files are numbered in the order they load —
                     each one has a comment header explaining its job.
   assets/data/      The sample spreadsheet and the empty template, openable in
                     Excel or Google Sheets.

 ─── To edit the map ──────────────────────────────────────────────────────
   1. Open assets/data/sample.csv (or empty_template.csv) in Excel.
   2. Edit the rows.
   3. Save as a spreadsheet (.csv) file.
   4. Drag-and-drop it onto the app.

 ─── To change colours / fonts ────────────────────────────────────────────
   Edit assets/css/01-variables.css and reload the page.

 ─── To change behaviour ──────────────────────────────────────────────────
   The JS modules in assets/js/ are deliberately small and well-commented.
   Pick the one that names what you want to change.
================================================================================
-->

  <!-- ──────────────────────────────────────────────────────────────────────
       THEME — set <html data-theme> BEFORE any CSS paints, so there's no flash.
       Uses the saved choice if there is one, otherwise the OS preference.
       Twilight (dark) and Linen (light) are both defined in 01-variables.css.

  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';

        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

);font-weight:var(--fw-semibold);color:var(--text-primary);flex:auto;overflow:hidden}.ins .dhead .m{margin:0}.ins .dhead .dmove{text-align:right;font-family:var(--font-mono);font-size:var(--fs-cap);font-weight:var(--fw-semibold);font-variant-numeric:tabular-nums;color:var(--text-tertiary);flex:0 0 52px}.ins .dhead .dmove.good{color:var(--status-good)}.ins .dhead .dmove.bad{color:var(--status-bad)}.ins .dhead .dmove.none{color:var(--accent-amber)}.ins .strandrow .dest em{font-style:normal;font-family:var(--font-mono);font-size:var(--fs-cap);color:var(--text-tertiary);margin-left:var(--space-1)}.tooltip-move{font-size:var(--fs-body);color:var(--text-secondary);margin:2px 0 4px}.tooltip-move b{font-family:var(--font-mono);font-weight:var(--fw-semibold)}.tooltip-move.good b{color:var(--status-good)}.tooltip-move.bad b{color:var(--status-bad)}.tooltip-move.none b{color:var(--accent-amber)}.tooltip-move.flat b{color:var(--text-tertiary)}

</head>
<body>

<!-- ============================================================================
     APP SHELL
     The 3-column grid (sidebar / visualization / detail panel) below the
     top header. The CSS that makes this a grid lives in 03-app-shell.css.
     ========================================================================== -->
<div class="app">

  <!-- ============== TOP HEADER ============== -->
  <header class="app-header">
    <!-- Brand mark: the thread through the nodes. Decorative (not a link),
         drawn in the purple "enable" data-hue so it never reads as the
         interactive blue. The wordmark is gone — the header row is the app's
         scarcest space and the name is already in the tab title and on the
         empty state. The label survives for screen readers.
         Styles in 03-app-shell.css. -->
    <div class="app-brand" aria-label="Ariadne Maps">
      <svg class="app-brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 17C8 17 8 8 12 8s4 9 8 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
        <circle cx="4" cy="17" r="2.1" fill="currentColor"></circle>
        <circle cx="12" cy="8" r="2.1" fill="currentColor"></circle>
        <circle cx="20" cy="17" r="2.1" fill="currentColor"></circle>
      </svg>
    </div>

    <!-- Search box (icon + text input) — stretches to fill the row, with the
         action buttons pinned to the right. JS in 17a-search.js fills the
         #search-results dropdown below as the user types. -->
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input id="search-input" class="search-input" placeholder="Search boxes  (press /  ·  ↑↓ to move  ·  Esc to clear)">
      <div id="search-results" class="search-results" hidden></div>
    </div>

    <!-- Header actions. The app opens in READING mode, where the header holds
         only what a reader reaches for: Filters (opens the left drawer),
         Import, Export (a menu over the three ways out), Simulate, and the
         switch into editing. Authoring actions — New map, Bulk edit — are
         .edit-only and appear when you switch. Trigger classes / ids are
         unchanged so the handlers in 17-events.ts still bind. -->
    <button id="filters-button" class="header-button" aria-expanded="false"
            data-tooltip="Rows, columns, tags and link styles — what the map is showing.">Filters</button>

    <span class="header-divider" aria-hidden="true"></span>
    <button class="header-button import-data-trigger" data-tooltip="Open a map spreadsheet — same as dragging one onto the window.">Import</button>

    <!-- Export menu. The three exports differ only in the file they hand you,
         so they read as one action with three answers rather than three
         buttons competing for the same glance. -->
    <div class="menu-wrap">
      <button id="export-button" class="header-button" aria-haspopup="true" aria-expanded="false"
              data-tooltip="Take the map with you — spreadsheet, image, or a web page.">Export</button>
      <div id="export-menu" class="menu" role="menu" hidden>
        <button class="menu-item save-data-trigger" role="menuitem">
          <b>Spreadsheet</b><span>A .csv you can edit in Excel or Sheets and load back in.</span>
        </button>
        <button class="menu-item export-image-trigger" role="menuitem">
          <b>Image</b><span>Copies a high-resolution PNG to the clipboard.</span>
        </button>
        <button class="menu-item publish-html-trigger" role="menuitem">
          <b>Web page</b><span>A self-contained, view-only page — pan, zoom, hover.</span>
        </button>
      </div>
    </div>

    <button id="sim-toggle-button" class="header-button" data-tooltip="Turn on what-if mode — a slider on every adjustable input; its effects update live.">Simulate</button>

    <!-- Atlas. A reading tool, so it goes away while editing (.read-only).
         Unlike Simulate, an atlas is always OF one box: with a box selected the
         button opens straight into it, and with nothing selected it drops a
         short list of the boxes worth starting from. A disabled button would
         have been the easy answer and the wrong one — grey chrome is chrome
         people stop seeing, and this control's whole job is to be seen. -->
    <div class="menu-wrap read-only">
      <button id="atlas-button" class="header-button" aria-haspopup="true" aria-expanded="false"
              data-tooltip="Every pathway out of one box, as one picture you zoom into.">Atlas</button>
      <div id="atlas-menu" class="menu" role="menu" hidden></div>
    </div>

    <span class="header-divider" aria-hidden="true"></span>
    <button class="header-button edit-only create-map-trigger" data-tooltip="Clear the map and start from an empty 3×3 grid.">New map</button>
    <button class="header-button edit-only edit-data-trigger" data-tooltip="Edit the whole map in a form — handy for many edits at once.">Bulk edit</button>
    <button id="mode-toggle-button" class="header-button header-button--primary"
            data-tooltip="Switch between reading the map and changing it.">Edit</button>
    <button id="theme-toggle-button" class="header-button header-button--icon" data-tooltip="Switch between the light and dark theme. Your choice is remembered." aria-label="Switch theme">☀</button>
  </header>

  <!-- Hidden file picker. Clicking any .import-data-trigger button triggers it. -->
  <input type="file" id="hidden-file-input" accept=".csv,text/csv" style="display: none;">
  <!-- Toast container — JS fills it via showLoadFeedback() -->
  <div id="load-feedback" class="load-feedback" style="display: none;"></div>

  <!-- ============== LEFT SIDEBAR ============== -->
  <aside class="sidebar" id="sidebar">
    <!-- Sticky header strip at the top of the panel. Holds the pin button
         centred in the header; the label reads "Click here to (un)pin" and
         the pin icon sits to the right of the text as if it were part of it. -->
    <div class="panel-header">
      <button class="panel-pin sidebar-pin" id="sidebar-pin" aria-label="Collapse sidebar">
        <span class="panel-pin-label"></span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 6 9 12 15 18"></polyline>
        </svg>
      </button>
    </div>

    <!-- Simulation panel — JS fills it in 14-simulation-panel.js -->
    <div class="sidebar-section" id="simulation-panel-section">
      <div id="simulation-panel" style="display: none;"></div>
    </div>

    <!-- Columns — JS fills the list in 13-sidebar.ts. Editable: rename,
         add, drag-to-reorder, confirm + cascade delete. Columns have no
         filter toggle (filtering by column isn't a feature).
         The "+" sits ON the eyebrow rather than under the list: a full-width
         button per section cost a row plus its margin four times over, and the
         action belongs beside the thing it adds to. It keeps .sidebar-add-btn
         and data-add so the one-time wiring in 17-events.ts still finds it. -->
    <div class="sidebar-section" id="stages-section">
      <div class="sidebar-section-title"><span>Columns</span><button class="sidebar-add-btn" data-add="stage" data-tooltip="Add a column" aria-label="Add a column">+</button></div>
      <div id="stages-list"></div>
    </div>

    <!-- Row filters + editing — JS fills the list in 13-sidebar.ts -->
    <div class="sidebar-section" id="stream-filters-section">
      <div class="sidebar-section-title"><span>Rows</span><button class="sidebar-add-btn" data-add="stream" data-tooltip="Add a row" aria-label="Add a row">+</button></div>
      <div id="stream-filters"></div>
    </div>

    <!-- Category filters + editing — JS fills the list in 13-sidebar.js.
         Rendered as two groups (Fill tag / Corner tag), each with
         its own heading, count and "+ Add" button. Per-row edit matches streams:
         click the swatch to recolour, double-click the name to rename, the
         "→ fill tag / → corner tag" button reclassifies, trash deletes; click the row body
         to toggle visibility. The headings + add buttons are rendered (not
         static), so they're wired per-render in 13-sidebar.js. -->
    <div class="sidebar-section" id="category-filters-section">
      <div id="category-filters"></div>
    </div>

    <!-- Link / line-style / highlight filters. Same toggle model as the tags:
         click to hide that link effect or line style on the map, click again to
         show it. Each group is three or fewer chips, so they cost a line apiece
         and are no longer worth folding away — which is what they were, behind
         a disclosure most readers never opened. -->
    <div class="sidebar-section"><div id="edge-type-filters"></div></div>
    <div class="sidebar-section"><div id="edge-style-filters"></div></div>
    <div class="sidebar-section"><div id="trace-filters"></div></div>
  </aside>

  <!-- ============== PANEL RESIZE HANDLES ==============
       Slim vertical drag bars between the side panels and the central viz.
       Drag to resize the adjacent panel; double-click to reset to default.
       JS wiring + persistence live in 17-events.js. Hidden when the
       respective panel is unpinned (resize doesn't apply in strip mode). -->
  <div class="panel-resize-handle sidebar-resize-handle" id="sidebar-resize-handle"
       data-tooltip="Drag to resize. Double-click to reset."></div>
  <div class="panel-resize-handle detail-resize-handle"  id="detail-resize-handle"
       data-tooltip="Drag to resize. Double-click to reset."></div>

  <!-- ============== CENTER VISUALIZATION ============== -->
  <main class="viz-container" id="viz-container">
    <!-- Scrollable area containing the rendered SVG. JS in 11-rendering.js
         writes the SVG contents on every render. -->
    <div class="viz-scroll" id="viz-scroll">
      <svg id="viz-svg" class="viz-svg"></svg>
    </div>

    <!-- Map controls cluster (bottom-right): highlight-depth + zoom. Stacked
         on narrow viewports, laid out side by side on widescreen. Each control
         carries a title so the two are easy to tell apart. JS in 17-events.js
         wires the −/+ buttons. -->
    <div class="viz-controls-cluster">

      <!-- Highlight-depth: how many connected levels light up when a node is
           selected. -->
      <div class="viz-depth-controls" id="viz-depth-controls"
           data-tooltip="How many connected levels to highlight when a box is selected.">
        <span class="viz-control-title">Highlight depth</span>
        <div class="viz-control-row">
          <button class="viz-depth-button" id="viz-depth-down" aria-label="Decrease highlight depth">−</button>
          <span class="viz-depth-readout" id="viz-depth-readout">1</span>
          <button class="viz-depth-button" id="viz-depth-up" aria-label="Increase highlight depth">+</button>
        </div>
      </div>

      <!-- Zoom. -->
      <div class="viz-zoom-controls" id="viz-zoom-controls"
           data-tooltip="Zoom the map in and out.">
        <span class="viz-control-title">Zoom</span>
        <div class="viz-control-row">
          <button class="viz-zoom-button" id="viz-zoom-out"  data-tooltip="Zoom out (Ctrl+−)" aria-label="Zoom out">−</button>
          <button class="viz-zoom-readout" id="viz-zoom-readout" data-tooltip="Fit the whole map in the frame">100%</button>
          <button class="viz-zoom-button" id="viz-zoom-in"   data-tooltip="Zoom in (Ctrl+=)"  aria-label="Zoom in">+</button>
        </div>
      </div>

    </div>

    <!-- The pathway atlas — everything downstream of one box, drawn over the
         map as one picture you zoom into. Filled by 21-atlas-view.ts when a
         box's Atlas is opened; empty and hidden otherwise. -->
    <div id="atlas-stage" class="atlas-stage" hidden></div>

    <!-- Optional CSV-import overlay. No longer shown at startup — the
         canvas boots into an empty 3x3 starter grid instead, and you click
         a cell to add your first node. Kept here for future use (e.g. a
         dedicated "Import map" page). -->
    <div id="drop-zone" class="drop-zone" style="display: none;">
      <div class="drop-zone-inner">
        <div class="drop-zone-icon">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <div class="drop-zone-brand">Ariadne Maps<span class="drop-zone-tagline">Map cause and effect</span></div>
        <div class="drop-zone-title">Drop a spreadsheet here to build your map</div>

<!-- Theme toggle wiring (kept inline + out of the TS bundle so it has no build
     dependencies). The label shows the theme you'd switch TO. -->
<script>
  (function () {
    var btn = document.getElementById('theme-toggle-button');
    if (!btn) return;
    function relabel() {
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      // Icon only — the button shows the theme you'd switch TO, and the word
      // was costing header room that the map wanted.
      btn.textContent = isLight ? '☾' : '☀';
      btn.setAttribute('aria-label', isLight ? 'Switch to the dark theme' : 'Switch to the light theme');
    }
    relabel();
    btn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      relabel();
    });
  })();
</script>
